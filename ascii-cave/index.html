<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<meta name="description" content="拿著手電筒走進一條沒有盡頭的鐵道隧道，整個畫面用 ASCII 字元畫出來，牆上貼滿在亞美尼亞拍到的塗鴉。點一下畫面，光就照過去。">
<meta property="og:type" content="website">
<meta property="og:title" content="ASCII 洞窟">
<meta property="og:description" content="拿著手電筒走進一條沒有盡頭的鐵道隧道，整個畫面用 ASCII 字元畫出來，牆上貼滿在亞美尼亞拍到的塗鴉。">
<meta property="og:image" content="https://gassao1998.github.io/ascii-cave/preview.jpg">
<meta name="theme-color" content="#000000">
<style>
  /* the work is black in both themes; the blocks below only restate it so either theme stamp resolves */
  :root {
    --bg: #000;
    --hint: rgba(232, 226, 210, 0.34);
    --text: #d8d2c4;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #000; --hint: rgba(232, 226, 210, 0.34); --text: #d8d2c4; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #000; --hint: rgba(232, 226, 210, 0.34); --text: #d8d2c4; color-scheme: dark; }

  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #msg {
    position: fixed; left: 0; right: 0; margin: 0; padding: 0 16px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 6vh);
    text-align: center; color: var(--hint); pointer-events: none;
    font: 13px/1.5 system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    letter-spacing: 0.14em; transition: opacity 1.2s ease;
  }
  #msg.off { opacity: 0; }
  #msg.err { color: var(--text); }
  #safe {
    position: fixed; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.39.6/build/index.min.js"
  }
}
</script>
</head>
<body>
<canvas id="view" role="img" aria-label="ASCII 字元畫的鐵道隧道，手電筒一直往前照，點擊或觸控畫面可以改變光照的方向"></canvas>
<p id="msg" hidden>點畫面照亮</p>
<div id="safe"></div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { SimplexNoise } from 'three/addons/math/SimplexNoise.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const canvas = document.getElementById('view');
const msg = document.getElementById('msg');
const safeProbe = document.getElementById('safe');
const params = new URLSearchParams(location.search);

function fail() {
  msg.textContent = '這個瀏覽器無法顯示這件作品，需要支援 WebGL 2 的瀏覽器。';
  msg.className = 'err';
  msg.hidden = false;
}
if (!document.createElement('canvas').getContext('webgl2')) fail();
else start().catch((e) => { console.error(e); fail(); });

async function start() {
  // ---------- constants ----------
  const R = 2.3, HW = 2.0, S = 2 * HW + Math.PI * R;   // tunnel half width, wall height, profile length
  const NS = 72, DS = S / NS;                          // samples around the arch
  const DZ = 0.25, SEG_L = 12, NZ = SEG_L / DZ, SEGS = 6; // segment layout: 6 x 12 m of wall ahead
  const EYE = 1.6, SPEED = 1.15;                       // eye height, walk speed (m/s)
  // scene texels per cell side; by default 1 for the 3-4 px cells, which are nearly pixels already (README has the numbers)
  const K_FORCED = [1, 2, 3, 4].includes(Number(params.get('k'))) ? Number(params.get('k')) : 0;
  const CHARS = ' .:-=+*#%@';
  // assets/graffiti/*.jpg, cropped by tools/crop_graffiti.py; the first three are placed specially
  const GRAFFITI = ['cat-arch', 'mural-sun', 'mural-dish', 'lilac', 'blue', 'bfd', 'code', 'yellow-e', 'love', 'fists',
    'green', 'pillar', 'scam', 'mos-erevan', 'suka', 'gey', 'throw-green', 'green-saints', 'shutter',
    'tugan', 'underpass-l', 'underpass-cat', 'underpass-teal', 'underpass-lilac', 'make-love', 'protect-trans', 'portal-red',
    'portal-tags', 'orange', 'tasma', 'fuck-you', 'column', 'card', 'kiss', 'eyes'];
  const START = Math.max(0, Number(params.get('at')) || 0); // ?at=metres starts further in; ?pause=1 stands still
  const PAUSE = params.get('pause') === '1';
  const BOB = params.get('bob') === '1';
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const DEG = Math.PI / 180;

  // ---------- renderer & passes ----------
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
  renderer.setClearColor(0x000000, 1);

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x000000, 6, 40);
  const camera = new THREE.PerspectiveCamera(60, 1, 0.05, 1500); // far enough for the sky outside
  camera.position.set(0, EYE, 0);

  const handScene = new THREE.Scene();
  const handCamera = new THREE.PerspectiveCamera(60, 1, 0.01, 5);

  const asciiShader = {
    uniforms: {
      tDiffuse: { value: null },
      tGlyph: { value: null },
      uGrid: { value: new THREE.Vector2(1, 1) },
      uOffset: { value: new THREE.Vector2() },
      uTexel: { value: new THREE.Vector2() },
      uCell: { value: 8 },
      uFade: { value: 0 },
      uRaw: { value: params.get('ascii') === '0' ? 1 : 0 }, // ?ascii=0 shows the scene behind the characters
    },
    vertexShader: /* glsl */`
      void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }`,
    fragmentShader: /* glsl */`
      uniform sampler2D tDiffuse;
      uniform sampler2D tGlyph;
      uniform vec2 uGrid, uOffset, uTexel;
      uniform float uCell, uFade, uRaw;
      const float N = ${CHARS.length}.0;
      void main() {
        vec2 p = gl_FragCoord.xy + uOffset;
        vec2 cell = floor(p / uCell);
        vec2 local = (p - cell * uCell) / uCell;
        vec2 uv = (cell + 0.5) / uGrid;
        // four bilinear taps = box average of the cell's 4x4 scene texels (steadier than one sample)
        vec3 c = texture2D(tDiffuse, uv - uTexel).rgb + texture2D(tDiffuse, uv + uTexel).rgb
               + texture2D(tDiffuse, uv + vec2(uTexel.x, -uTexel.y)).rgb + texture2D(tDiffuse, uv + vec2(-uTexel.x, uTexel.y)).rgb;
        // tone-map the luminance only (Reinhard), so paint inside the hot spot keeps its hue and some contrast
        float lin = dot(c, vec3(0.2126, 0.7152, 0.0722)), t = lin * 0.5;
        c = min(c * (t / (1.0 + t)) / max(lin, 1e-5), 1.0);
        c = pow(c, vec3(1.0 / 2.2)) * uFade;     // perceptual space: glyph density follows what the eye sees
        float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
        float idx = min(floor(l * N * 1.08), N - 1.0); // darkest tenth stays empty: unlit rock is black
        float m = texture2D(tGlyph, vec2((idx + local.x) / N, local.y)).r;
        float peak = max(max(c.r, c.g), max(c.b, 1e-3));
        vec3 col = c * min(1.0 / peak, (0.35 + 0.65 * l) / max(l, 1e-3)); // dim glyphs keep their hue, never clip it
        gl_FragColor = vec4(mix(col * m, c, uRaw), 1.0);
      }`,
  };

  const composer = new EffectComposer(renderer);
  composer.setPixelRatio(1); // its targets are sized in scene texels (K per character cell), not screen pixels
  composer.addPass(new RenderPass(scene, camera));
  // the ROT-54 walkway outside: its own scene (moonlight must not reach into the tunnel), drawn over the same
  // depth buffer so tunnel walls and the outdoors hide each other correctly; only on while a walkway is near
  const outScene = new THREE.Scene();
  const outPass = new RenderPass(outScene, camera);
  outPass.clear = false;
  outPass.enabled = false;
  composer.addPass(outPass);
  const handPass = new RenderPass(handScene, handCamera);
  handPass.clear = false;
  handPass.clearDepth = true; // the hand is never hidden by the tunnel
  composer.addPass(handPass);
  const asciiPass = new ShaderPass(asciiShader);
  composer.addPass(asciiPass);
  const U = asciiPass.uniforms;

  // ?ascii=pmndrs swaps in the postprocessing package's ASCIIEffect; kept only to compare with the shader above (see README)
  const pmndrs = params.get('ascii') === 'pmndrs' ? await (async () => {
    const PP = await import('postprocessing');
    const pc = new PP.EffectComposer(renderer, { frameBufferType: THREE.HalfFloatType });
    pc.addPass(new PP.RenderPass(scene, camera));
    const hp = new PP.RenderPass(handScene, handCamera);
    hp.clearPass.setClearFlags(false, true, false);
    pc.addPass(hp);
    pc.addPass(new PP.EffectPass(camera, new PP.ToneMappingEffect()));
    const fx = new PP.ASCIIEffect({ asciiTexture: new PP.ASCIITexture({ characters: CHARS }) });
    pc.addPass(new PP.EffectPass(camera, fx));
    return { composer: pc, fx };
  })() : null;

  // ---------- lights ----------
  scene.add(new THREE.AmbientLight(0xc4cad8, 0.008));
  const beam = new THREE.SpotLight(0xfff0dc, 85, 0, 0.34, 0.6, 1.6);   // hot spot with a soft edge
  const spill = new THREE.SpotLight(0xfff0dc, 3.4, 0, 0.75, 1, 1.6);   // the dim halo around it
  const bounce = new THREE.PointLight(0xc8ccd8, 0.5, 0, 2);            // light thrown back by the walls: faint near you, gone far away
  scene.add(beam, beam.target, spill, spill.target, bounce);

  // ---------- tunnel walls ----------
  const simplex = new SimplexNoise();
  const fbm = (x, y) => simplex.noise(x, y) * 0.62 + simplex.noise(x * 2.3, y * 2.3) * 0.28 + simplex.noise(x * 5.1, y * 5.1) * 0.1;
  const prof = { x: 0, y: 0, nx: 0, ny: 0 };
  function profile(s) { // ideal cross-section point and outward normal at arc length s (left floor -> arch -> right floor)
    if (s < HW) { prof.x = -R; prof.y = s; prof.nx = -1; prof.ny = 0; }
    else if (s > S - HW) { prof.x = R; prof.y = S - s; prof.nx = 1; prof.ny = 0; }
    else { const a = Math.PI - (s - HW) / R; prof.nx = Math.cos(a); prof.ny = Math.sin(a); prof.x = R * prof.nx; prof.y = HW + R * prof.ny; }
  }

  const GW = NS + 3, GH = NZ + 3;  // padded grid (one extra ring all round for normals)
  const wallIndex = (() => {
    const idx = new Uint16Array(NS * NZ * 6);
    let k = 0;
    for (let j = 0; j < NZ; j++) for (let i = 0; i < NS; i++) {
      const a = j * (NS + 1) + i, b = a + 1, c = a + NS + 1, d = c + 1;
      idx.set([a, b, c, b, d, c], k); k += 6;
    }
    return new THREE.BufferAttribute(idx, 1);
  })();
  const wallMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95 });

  // ---------- graffiti atlas ----------
  const images = (await Promise.all(GRAFFITI.map(async (name) => {
    const img = new Image();
    img.crossOrigin = 'anonymous'; // opened from file:// the pictures fail to load instead of breaking WebGL
    img.src = `assets/graffiti/${name}.jpg`;
    try { await img.decode(); return { name, img }; } catch { return null; }
  }))).filter(Boolean);
  const AW = 2048, PAD = 4;
  images.sort((a, b) => b.img.height - a.img.height);
  let ax = 0, ay = 0, rowH = 0;
  for (const e of images) {           // shelf packing
    if (ax + e.img.width > AW) { ax = 0; ay += rowH + PAD; rowH = 0; }
    e.x = ax; e.y = ay; ax += e.img.width + PAD; rowH = Math.max(rowH, e.img.height);
  }
  const AH = Math.max(1, ay + rowH);
  const fit = Math.min(1, 4096 / AH);  // phones cap textures at 4096 px; shrinking the whole atlas keeps every uv
  const atlasCanvas = document.createElement('canvas');
  atlasCanvas.width = Math.round(AW * fit); atlasCanvas.height = Math.round(AH * fit);
  const actx = atlasCanvas.getContext('2d', { willReadFrequently: true });
  actx.scale(fit, fit);
  for (const e of images) actx.drawImage(e.img, e.x, e.y);
  const catImg = images.find((e) => e.name === 'cat-arch');
  if (catImg) { // white strokes on black -> strokes on transparent, so only the lines land on the wall
    const [x, y, w, h] = [catImg.x, catImg.y, catImg.img.width, catImg.img.height].map((v) => Math.round(v * fit));
    const d = actx.getImageData(x, y, w, h);
    for (let k = 0; k < d.data.length; k += 4) {
      const lum = 0.2126 * d.data[k] + 0.7152 * d.data[k + 1] + 0.0722 * d.data[k + 2];
      d.data[k + 3] = Math.max(0, Math.min(255, (lum - 40) * 2.5));
    }
    actx.putImageData(d, x, y);
  }
  const atlas = new THREE.CanvasTexture(atlasCanvas);
  atlas.colorSpace = THREE.SRGBColorSpace;
  atlas.anisotropy = 4;
  const pieces = images.map((e) => ({
    name: e.name, aspect: e.img.width / e.img.height,
    u0: (e.x + 1) / AW, du: (e.img.width - 2) / AW, v0: 1 - (e.y + e.img.height - 1) / AH, dv: (e.img.height - 2) / AH,
  }));
  const special = Object.fromEntries(['cat-arch', 'mural-sun', 'mural-dish'].map((n) => [n, pieces.find((p) => p.name === n)]));
  const others = pieces.filter((p) => !Object.values(special).includes(p));
  const decalMat = new THREE.MeshStandardMaterial({
    map: atlas, vertexColors: true, transparent: true, depthWrite: false, roughness: 0.85,
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
  });

  // ---------- segments (rebuilt in place when they fall behind, nothing allocated afterwards) ----------
  const DECAL_VERTS = 6000, DECAL_INDEX = 36000;
  // cat picture edges, see addProjection; lowered 0.06 from the filmed framing so the ears fit a landscape view
  const TAN = { x0: -0.364, x1: 0.2965, y0: -0.39, y1: 0.418 };
  const Z_FIRST = 4 - SEG_L * (1 + Math.floor(START / SEG_L)); // far end of the first segment ahead
  const slot = (seg) => Math.round((4 - SEG_L - seg.z0) / SEG_L); // world-fixed segment number
  // 156 m of tunnel, then 84 m outside on the ROT-54 walkway, and again; walkway slots build no tunnel
  const TUNNEL_SLOTS = 13, WALK_SLOTS = 7, CYCLE = TUNNEL_SLOTS + WALK_SLOTS;
  const isWalk = (n) => n % CYCLE >= TUNNEL_SLOTS;
  const zoneExit = (k) => 4 - SEG_L * (TUNNEL_SLOTS + CYCLE * k); // z where the k-th walkway leaves the tunnel
  let bag = [];
  const rand = (a, b) => a + Math.random() * (b - a);
  const nextPiece = () => { if (!bag.length) bag = others.slice().sort(() => Math.random() - 0.5); return bag.pop(); };

  const segments = Array.from({ length: SEGS }, (_, k) => {
    const wall = new THREE.BufferGeometry();
    for (const [name, size] of [['position', 3], ['normal', 3], ['color', 3]]) {
      wall.setAttribute(name, new THREE.BufferAttribute(new Float32Array((NS + 1) * (NZ + 1) * size), size).setUsage(THREE.DynamicDrawUsage));
    }
    wall.setIndex(wallIndex);
    const decal = new THREE.BufferGeometry();
    for (const [name, size] of [['position', 3], ['normal', 3], ['uv', 2], ['color', 4]]) {
      decal.setAttribute(name, new THREE.BufferAttribute(new Float32Array(DECAL_VERTS * size), size).setUsage(THREE.DynamicDrawUsage));
    }
    decal.setIndex(new THREE.BufferAttribute(new Uint16Array(DECAL_INDEX), 1).setUsage(THREE.DynamicDrawUsage));
    const seg = {
      z0: Z_FIRST - k * SEG_L, P: new Float32Array(GW * GH * 3), N: new Float32Array(GW * GH * 3),
      wall: new THREE.Mesh(wall, wallMat), decal: new THREE.Mesh(decal, decalMat), nv: 0, ni: 0,
    };
    seg.wall.frustumCulled = seg.decal.frustumCulled = false; // rebuilt in place, bounds would go stale
    scene.add(seg.wall, seg.decal);
    buildSegment(seg);
    return seg;
  });

  function buildSegment(seg) {
    seg.walk = isWalk(slot(seg));
    seg.wall.visible = seg.decal.visible = !seg.walk;
    if (seg.track) placeTrack(seg);
    if (seg.walk) return;
    const { P, N } = seg;
    for (let j = -1; j <= NZ + 1; j++) {
      const z = seg.z0 + j * DZ;
      for (let i = -1; i <= NS + 1; i++) {
        const s = i * DS;
        profile(s);
        const y = prof.y;
        const amp = y < 0.15 ? 0 : Math.min(1, (y - 0.15) / 0.5) * (y < HW ? 0.05 : 0.05 + 0.12 * Math.min(1, (y - HW) / 0.8));
        const d = amp * fbm(s * 0.75, z * 0.75);
        const k = ((j + 1) * GW + i + 1) * 3;
        P[k] = prof.x + prof.nx * d; P[k + 1] = y + prof.ny * d; P[k + 2] = z;
      }
    }
    for (let j = 0; j <= NZ; j++) for (let i = 0; i <= NS; i++) { // central-difference normals, pointing into the tunnel
      const k = ((j + 1) * GW + i + 1) * 3, ip = k + 3, im = k - 3, jp = k + GW * 3, jm = k - GW * 3;
      const ax_ = P[ip] - P[im], ay_ = P[ip + 1] - P[im + 1], az_ = P[ip + 2] - P[im + 2];
      const bx = P[jp] - P[jm], by = P[jp + 1] - P[jm + 1], bz = P[jp + 2] - P[jm + 2];
      let nx = ay_ * bz - az_ * by, ny = az_ * bx - ax_ * bz, nz = ax_ * by - ay_ * bx;
      const l = Math.hypot(nx, ny, nz) || 1;
      N[k] = nx / l; N[k + 1] = ny / l; N[k + 2] = nz / l;
    }
    const { position: pos, normal: nor, color: col } = seg.wall.geometry.attributes;
    const pa = pos.array, na = nor.array, ca = col.array;
    let v = 0;
    for (let j = 0; j <= NZ; j++) for (let i = 0; i <= NS; i++, v += 3) {
      const k = ((j + 1) * GW + i + 1) * 3;
      pa[v] = P[k]; pa[v + 1] = P[k + 1]; pa[v + 2] = P[k + 2];
      na[v] = N[k]; na[v + 1] = N[k + 1]; na[v + 2] = N[k + 2];
      const y = P[k + 1], s = i * DS;
      const base = y < HW ? 0.32 : 0.32 - 0.08 * Math.min(1, (y - HW) / 1.2);
      const b = base * (0.7 + 0.4 * simplex.noise(s * 0.33 + 40, P[k + 2] * 0.22)) * (y < 0.6 ? 0.55 + 0.75 * y : 1);
      ca[v] = b; ca[v + 1] = b * 0.96; ca[v + 2] = b * 0.9;
    }
    pos.needsUpdate = nor.needsUpdate = col.needsUpdate = true;
    placeGraffiti(seg);
  }

  function placeGraffiti(seg) {
    seg.nv = seg.ni = 0;
    const n = slot(seg), top = seg.z0 + SEG_L - rand(0.05, 0.6);
    const cat = special['cat-arch'], sun = special['mural-sun'], dish = special['mural-dish'];
    if (n % 4 === 1 && cat) { // every 48 m the cat spans both walls and the ceiling; the walls under it stay bare
      const eye = seg.z0 + SEG_L + 0.5;
      addProjection(seg, cat, eye, 1.5);
      for (const side of [-1, 1]) { fill(seg, side, eye - 2.2, top); fill(seg, side, seg.z0 + 0.1, eye - 11.5); }
    } else if (n % 6 === 3 && sun && dish) { // every 72 m the control-room mural, laid out as on its wall
      const side = Math.floor(n / 6) % 2 ? 1 : -1, H = 1.7, L = H * sun.aspect, H2 = H * 0.86, L2 = H2 * dish.aspect;
      const zc = seg.z0 + rand(0.8, SEG_L - L - 0.8), yd = 0.15, ys = yd + H2;
      addDecal(seg, side, ys, ys + H, zc, zc + L, sun, 1.15);
      const zd = side < 0 ? zc : zc + L - L2; // the dish part sits under the right-hand end of the band
      addDecal(seg, side, yd, ys, zd, zd + L2, dish, 1.15);
      fill(seg, side, zc + L + 0.3, top);
      fill(seg, side, seg.z0 + 0.1, zc - 0.3);
      fill(seg, -side, seg.z0 + 0.1, top);
    } else {
      for (const side of [-1, 1]) fill(seg, side, seg.z0 + 0.1, top);
    }
    const g = seg.decal.geometry;
    for (const name of ['position', 'normal', 'uv', 'color']) g.attributes[name].needsUpdate = true;
    g.index.needsUpdate = true;
    g.setDrawRange(0, seg.ni);
  }

  function fill(seg, side, zMin, zMax) { // dense, random wall of pieces between zMin and zMax
    let z = zMax;
    while (others.length) {
      const p = nextPiece();
      let h = rand(1.3, 2.0), w = h * p.aspect;
      if (w > 3.8) { w = 3.8; h = w / p.aspect; }
      if (z - w < zMin) break;
      const y0 = rand(0.2, 0.45);
      addDecal(seg, side, y0, y0 + h, z - w, z, p, rand(1.05, 1.35));
      if (Math.random() < 0.45) { // a smaller piece higher up, where the arch starts
        const q = nextPiece(), qh = Math.min(rand(0.7, 1.0), w / q.aspect), qw = qh * q.aspect, qz = z - rand(0, w - qw);
        addDecal(seg, side, y0 + h + 0.1, y0 + h + 0.1 + qh, qz - qw, qz, q, rand(0.95, 1.2));
      }
      z -= w + rand(0.05, 0.45);
    }
  }

  // The cat as filmed (phone held at eye height, about 40 deg across in portrait): project the picture back
  // from an eye point on the centre line at `eye`, so it reads whole from there and spreads over the
  // walls and ceiling as you walk under it. TAN (defined above) = the picture's edges as projector tangents.
  function addProjection(seg, p, eye, tint) {

    mg.setIndex(idx);
    sky.add(moon, new THREE.Points(sg, new THREE.PointsMaterial({ size: 1.6, sizeAttenuation: false, color: 0x8f9bbd, fog: false })),
      new THREE.Mesh(mg, new THREE.MeshBasicMaterial({ color: 0x05070c, side: THREE.DoubleSide, fog: false })));
  }
  const moonLight = new THREE.DirectionalLight(0xaebbd8, 0.9);
  moonLight.position.copy(MOON).multiplyScalar(50);
  sky.add(moonLight, moonLight.target);
  const beam2 = beam.clone(), spill2 = spill.clone(); // the torch lights the outdoors too
  outScene.add(new THREE.HemisphereLight(0x33405e, 0x0b0907, 0.35), beam2, beam2.target, spill2, spill2.target);
  renderer.compile(outScene, camera); // no shader compile stall the first time a walkway comes into view

  // ---------- hand holding the torch (drawn in its own scene, on top of everything) ----------
  // A left hand at real size (metres) in camera space, posed like an FPS view model: forearm from off-screen lower
  // left, the fist round the barrel in a diagonal power grip. Angles and proportions: docs/hand-anatomy.md.
  const skin = new THREE.MeshStandardMaterial({ color: 0x3e2d25, roughness: 0.85 });
  const metal = new THREE.MeshStandardMaterial({ color: 0x2b2d33, metalness: 0.3, roughness: 0.45 });
  const chrome = new THREE.MeshStandardMaterial({ color: 0x8b9099, metalness: 0.9, roughness: 0.3 });
  const hand = new THREE.Group();  // origin = centre of the grip, on the barrel axis
  const torch = new THREE.Group(); // turns toward the target; +Z is the beam
  hand.add(torch);
  const part = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); torch.add(m); return m; };
  const alongZ = (geo) => geo.rotateX(Math.PI / 2);
  const grip = await gripArm(); // CC0 wrad-arms viewmodel rig, left arm posed round the barrel; null if it can't load
  const RB = grip ? grip.radius : 0.016;
  part(alongZ(new THREE.CylinderGeometry(RB, RB, 0.17, 20)), metal, 0, 0, 0.015);          // barrel, tail just past the little finger
  part(alongZ(new THREE.CylinderGeometry(RB + 0.009, RB, 0.045, 20)), metal, 0, 0, 0.12);  // head out of the thumb web
  part(new THREE.TorusGeometry(RB + 0.008, 0.003, 8, 24), chrome, 0, 0, 0.143);          // bezel
  const led = part(new THREE.SphereGeometry(0.005, 12, 8), new THREE.MeshBasicMaterial({ color: new THREE.Color(0.35, 4, 0.9) }), 0, RB + 0.001, -0.058);
  // the forearm points from a reference elbow low on the left toward the wrist, so it leaves through the
  // bottom-left corner whatever the aim (view models are held higher than a real hand would be)
  const ELBOW = new THREE.Vector3(-0.3, -0.4, 0.1), SHOULDER_TO_ELBOW = new THREE.Vector3(0.3, 0.5, -0.8).normalize();
  const Y = new THREE.Vector3(0, 1, 0), wristPos = new THREE.Vector3(), wristQ = new THREE.Quaternion();
  const dirV = new THREE.Vector3(), handX = new THREE.Vector3(), zV = new THREE.Vector3(), basis = new THREE.Matrix4();

  async function gripArm() {
    const gltf = await new GLTFLoader().loadAsync('assets/models/arms.glb').catch(() => null);
    if (!gltf) return null;
    const S = 0.1;                                  // model units are decimetres
    const B = (n) => gltf.scene.getObjectByName(THREE.PropertyBinding.sanitizeNodeName(n)); // 'wrist.l' loads as 'wristl'
    let mesh = null;
    gltf.scene.traverse((o) => { if (o.isSkinnedMesh) mesh = o; });
    if (!mesh || !B('wrist.l')) return null;
    mesh.material = skin;
    mesh.frustumCulled = false;
    B('shoulder.r').scale.setScalar(1e-4);         // only the left arm is used
    gltf.scene.updateMatrixWorld(true);
    const wrist = B('wrist.l');
    const toWrist = wrist.matrixWorld.clone().invert();
    const W = (b) => b.getWorldPosition(new THREE.Vector3()).applyMatrix4(toWrist); // position in wrist space
    const FING = ['index', 'middle', 'ring', 'pinky'];
    const knuckle = FING.map((f) => W(B(`finger_${f}1.l`)));
    const radial = knuckle[0].clone().sub(knuckle[3]).normalize();   // little -> index side
    const distal = knuckle[1].clone().normalize();                   // wrist -> middle knuckle
    const palm = new THREE.Vector3().crossVectors(radial, distal).normalize();
    if (palm.dot(W(B('finger_thumb1.l')).sub(knuckle[1])) < 0) palm.negate(); // palmar side = the thumb's side
    const palmW = palm.clone().transformDirection(wrist.matrixWorld);
    const turn = (bone, axisW, deg) => {          // rotate a bone about a world axis through its own origin
      const pq = bone.parent.getWorldQuaternion(new THREE.Quaternion());
      bone.quaternion.premultiply(pq.clone().invert().multiply(new THREE.Quaternion().setFromAxisAngle(axisW, deg * DEG)).multiply(pq));
      bone.updateMatrixWorld(true);
    };
    // MP, PIP, DIP flexion (deg) for a 3 cm barrel, deeper toward the little finger in the diagonal grip
    const ANG = { index: [50, 75, 40], middle: [58, 80, 45], ring: [62, 85, 45], pinky: [66, 85, 45] };
    const fit = {};
    for (const f of FING) {
      const bones = [1, 2, 3].map((k) => B(`finger_${f}${k}.l`));
      const dirW = bones[1].getWorldPosition(new THREE.Vector3()).sub(bones[0].getWorldPosition(new THREE.Vector3())).normalize();
      const axisW = new THREE.Vector3().crossVectors(dirW, palmW).normalize();
      bones.forEach((b, k) => turn(b, axisW, ANG[f][k]));
      fit[f] = circumcircle(W(bones[0]), W(bones[1]), W(bones[2])); // the joint centres wrap the barrel
    }
    // barrel axis: diagonal across the palm, from the hypothenar heel out through the thumb web,
    // 40 deg off the knuckle line toward the fingertips, through the middle of the curled fingers
    const OBLIQUE = 40 * DEG;
    const D = radial.clone().multiplyScalar(Math.cos(OBLIQUE)).addScaledVector(distal, Math.sin(OBLIQUE)).normalize();
    const C = fit.middle.centre.clone().add(fit.ring.centre).multiplyScalar(0.5);
    const meanR = (fit.index.radius + fit.middle.radius + fit.ring.radius + fit.pinky.radius) / 4;
    const radius = THREE.MathUtils.clamp(meanR * S - 0.01, 0.012, 0.02);
    // thumb: swing it from the CMC so the tip lies on the barrel past the index finger, then MP 20 and IP 18
    const T = [1, 2, 3].map((k) => B(`finger_thumb${k}.l`));
    const side = W(T[0]).sub(C); side.addScaledVector(D, -side.dot(D)).normalize();
    const goal = C.clone().addScaledVector(D, fit.index.centre.clone().sub(C).dot(D) + 0.3)
      .addScaledVector(side, radius / S + 0.09).applyMatrix4(wrist.matrixWorld);
    const base = T[0].getWorldPosition(new THREE.Vector3());
    const tip = new THREE.Vector3(0, 0.28, 0).applyMatrix4(T[2].matrixWorld);
    const u = tip.sub(base).normalize(), v = goal.sub(base).normalize();
    turn(T[0], new THREE.Vector3().crossVectors(u, v).normalize(), u.angleTo(v) / DEG);
    const towardAxis = side.clone().negate().transformDirection(wrist.matrixWorld);
    const tDir = T[2].getWorldPosition(new THREE.Vector3()).sub(T[1].getWorldPosition(new THREE.Vector3())).normalize();
    const tAxis = new THREE.Vector3().crossVectors(tDir, towardAxis).normalize();
    turn(T[1], tAxis, 20);
    turn(T[2], tAxis, 18);
    // wrist frame in torch space: barrel axis -> +Z, back of the hand -> up and toward the eye, which sits
    // above and to the right of a hand in the lower-left corner (+X is the screen's left)
    const back = palm.clone().negate(); back.addScaledVector(D, -back.dot(D)).normalize();
    const m0 = new THREE.Matrix4().makeBasis(D, back, new THREE.Vector3().crossVectors(D, back));
    const up = new THREE.Vector3(-0.59, 0.81, 0), Z = new THREE.Vector3(0, 0, 1);
    const m1 = new THREE.Matrix4().makeBasis(Z, up, new THREE.Vector3().crossVectors(Z, up));
    const q = new THREE.Quaternion().setFromRotationMatrix(m1.multiply(m0.transpose()));
    const p = C.clone().multiplyScalar(S).applyQuaternion(q).negate();
    // the forearm, upper arm and shoulder bones are driven directly in hand space every frame
    const fore = B('forearm.l'), bicep = B('bicep.l'), shoulder = B('shoulder.l');
    const lenF = wrist.position.length() * S, lenB = fore.position.length() * S, lenS = bicep.position.length() * S;
    for (const b of [fore, bicep, shoulder]) { hand.add(b); b.scale.setScalar(S); }
    hand.add(gltf.scene);
    return { radius, q, p, wrist, fore, bicep, shoulder, lenF, lenB, lenS };
  }

  function circumcircle(a, b, c) { // centre and radius of the circle through three points
    const ab = b.clone().sub(a), ac = c.clone().sub(a), n = new THREE.Vector3().crossVectors(ab, ac);
    const t = new THREE.Vector3().crossVectors(n, ab).multiplyScalar(ac.lengthSq())
      .add(new THREE.Vector3().crossVectors(ac, n).multiplyScalar(ab.lengthSq())).divideScalar(2 * n.lengthSq());
    return { centre: a.clone().add(t), radius: t.length() };
  }
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: (() => {
      const c = document.createElement('canvas'); c.width = c.height = 64;
      const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      gr.addColorStop(0, 'rgba(120,255,150,1)'); gr.addColorStop(0.35, 'rgba(60,255,110,0.35)'); gr.addColorStop(1, 'rgba(0,255,80,0)');
      g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    })(),
    color: new THREE.Color(1, 1.8, 1.1), blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  glow.scale.setScalar(0.022);
  glow.position.copy(led.position);
  torch.add(glow);
  handScene.add(hand);
  // nearly black, like the silhouette in the reference video; light from down the tunnel leaves a thin rim
  handScene.add(new THREE.HemisphereLight(0x8c96b0, 0x0d0b09, 0.06));
  const key = new THREE.DirectionalLight(0xfff0dc, 0.1); key.position.set(0.6, 1.2, 0.8);
  const rim = new THREE.DirectionalLight(0xfff0dc, 1.1); rim.position.set(0.5, 0.9, -1);
  handScene.add(key, rim);
  const HEAD = new THREE.Vector3(0, 0, 0.145); // lens, in torch space

  // ---------- layout (resize, rotation, iframe resize) ----------
  const L = { W: 1, H: 1, cols: 1, rows: 1, cell: 8, offX: 0, offY: 0, w: 1, h: 1 };
  const bufferSize = new THREE.Vector2();
  function layout() {
    const w = Math.max(1, canvas.clientWidth), h = Math.max(1, canvas.clientHeight);
    const dpr = Math.min(window.devicePixelRatio || 1, 2); // 3x phones: the full-screen character pass is the cost
    const forced = Number(params.get('cell'));
    const cssCell = forced >= 1 && forced <= 32 ? forced : (w < 600 ? 1.5 : 2);
    renderer.setPixelRatio(dpr);
    renderer.setSize(w, h, false);
    renderer.getDrawingBufferSize(bufferSize);
    const cell = Math.max(3, Math.round(cssCell * dpr));
    const K = K_FORCED || (cell <= 4 ? 1 : 3);
    const cols = Math.ceil(bufferSize.x / cell), rows = Math.ceil(bufferSize.y / cell);
    Object.assign(L, { w, h, W: bufferSize.x, H: bufferSize.y, cols, rows, cell,
      offX: Math.floor((cols * cell - bufferSize.x) / 2), offY: Math.floor((rows * cell - bufferSize.y) / 2) });
    composer.setSize(cols * K, rows * K);
    U.uGrid.value.set(cols, rows);
    U.uOffset.value.set(L.offX, L.offY);
    U.uTexel.value.set(0.25 / cols, 0.25 / rows); // taps a quarter cell from the centre: a box average for any K
    if (U.uCell.value !== cell || !U.tGlyph.value) { U.tGlyph.value?.dispose(); U.tGlyph.value = glyphs(cell); }
    U.uCell.value = cell;
    if (pmndrs) { pmndrs.composer.setSize(w, h, false); pmndrs.fx.cellSize = cell; }
    // same tunnel framing in both orientations: aim for ~44 deg across, within 50-78 deg vertically
    const aspect = cols / rows;
    camera.aspect = handCamera.aspect = aspect;
    camera.fov = handCamera.fov = THREE.MathUtils.clamp(2 * Math.atan(Math.tan(22 * DEG) / aspect) / DEG, 50, 78);
    camera.updateProjectionMatrix();
    handCamera.updateProjectionMatrix();
    placeHand();
  }

  function placeHand() { // keep the fist in the lower-left corner, inside the safe area, sized to the screen
    const cs = getComputedStyle(safeProbe);
    const insetL = parseFloat(cs.paddingLeft) || 0, insetB = parseFloat(cs.paddingBottom) || 0;
    const { w, h } = L, portrait = w < h;
    const tanV = Math.tan(camera.fov * DEG / 2), tanH = tanV * camera.aspect, d = 0.42;
    const px = portrait ? Math.min(h * 0.26, w * 0.34) : Math.min(h * 0.3, w * 0.4); // on-screen size of fist + torch
    hand.scale.setScalar((px / h) * 2 * d * tanV / 0.16);
    const nx = -1 + 2 * (insetL + w * (portrait ? 0.26 : 0.2)) / w;
    const ny = -1 + 2 * (insetB + h * (portrait ? 0.2 : 0.24)) / h;
    hand.position.set(nx * tanH * d, ny * tanV * d, -d);
  }

  // At 3-4 device px a font glyph is a grey smudge, so small cells get hand-drawn 3x3 pixel forms of the same ten
  // characters: each step adds ink and keeps a recognisable shape ( . : - + = x # % @ ).
  const TINY = ['.........', '....#....', '.#.....#.', '...###...', '.#.###.#.', '###...###',
    '#.#.#.#.#', '#.#####.#', '####.####', '#########'];
  function glyphs(cell) {
    const c = document.createElement('canvas');
    c.width = cell * CHARS.length; c.height = cell;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = `bold ${Math.round(cell * 1.15)}px Menlo, Consolas, "DejaVu Sans Mono", "Roboto Mono", "Courier New", monospace`;
    const px = (i, n) => Math.round((n * cell) / 3);
    // a 6-10 px glyph is only a few grey pixels, so order the slots by how much each one really covers
    const order = [...CHARS].map((ch, i) => {
      if (cell <= 4) {
        [...TINY[i]].forEach((on, k) => {
          if (on === '#') g.fillRect(i * cell + px(i, k % 3), px(i, (k / 3) | 0), px(i, (k % 3) + 1) - px(i, k % 3), px(i, ((k / 3) | 0) + 1) - px(i, (k / 3) | 0));
        });
      } else g.fillText(ch, (i + 0.5) * cell, cell * 0.54);
      const d = g.getImageData(i * cell, 0, cell, cell).data;
      let ink = 0;
      for (let k = 3; k < d.length; k += 4) ink += d[k];
      return { i, ink };
    }).sort((a, b) => a.ink - b.ink);
    const out = document.createElement('canvas');
    out.width = c.width; out.height = cell;
    order.forEach(({ i }, j) => out.getContext('2d').drawImage(c, i * cell, 0, cell, cell, j * cell, 0, cell, cell));
    const t = new THREE.CanvasTexture(out);
    t.minFilter = t.magFilter = THREE.NearestFilter;
    t.generateMipmaps = false;
    return t;
  }

  new ResizeObserver(() => layout()).observe(canvas);
  layout();

  // ---------- aiming ----------
  const aim = new THREE.Vector2(0.08, -0.32), aimGoal = aim.clone();
  const dir = new THREE.Vector3(), target = new THREE.Vector3(), local = new THREE.Vector3(), head = new THREE.Vector3();
  let pressing = false, touched = false;
  function aimAt(e) {
    const r = canvas.getBoundingClientRect();
    const fx = (e.clientX - r.left) / r.width, fy = 1 - (e.clientY - r.top) / r.height;
    aimGoal.set(((fx * L.W + L.offX) / (L.cols * L.cell)) * 2 - 1, ((fy * L.H + L.offY) / (L.rows * L.cell)) * 2 - 1);
  }
  canvas.addEventListener('pointerdown', (e) => {
    pressing = touched = true;
    canvas.setPointerCapture(e.pointerId);
    aimAt(e);
    if (!msg.hidden) { msg.classList.add('off'); setTimeout(() => { msg.hidden = true; }, 1300); }
  });
  canvas.addEventListener('pointermove', (e) => { if (pressing) aimAt(e); });
  const release = () => { pressing = false; };
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('dblclick', (e) => e.preventDefault());

  function hitTunnel(o, d) { // distance from o along unit d to the idealised tunnel surface
    let t = 60;
    if (d.y < -1e-4) t = Math.min(t, -o.y / d.y);
    if (Math.abs(d.x) > 1e-4) {
      const ts = ((d.x > 0 ? R : -R) - o.x) / d.x;
      if (ts > 0 && o.y + d.y * ts <= HW) t = Math.min(t, ts);
    }
    const oy = o.y - HW, a = d.x * d.x + d.y * d.y;
    if (a > 1e-8) {
      const b = o.x * d.x + oy * d.y, c = o.x * o.x + oy * oy - R * R, disc = b * b - a * c;
      if (disc >= 0) { const ta = (-b + Math.sqrt(disc)) / a; if (ta > 0 && o.y + d.y * ta >= HW) t = Math.min(t, ta); }
    }
    return t;
  }

  // ---------- loop (paused when hidden or scrolled out of an embedding page) ----------
  let walked = START, fade = 0, last = 0, raf = 0, running = false, visible = !document.hidden, onScreen = true;
  function frame(now) {
    raf = requestAnimationFrame(frame);
    const dt = Math.min(0.1, (now - last) / 1000 || 0);
    last = now;
    const speed = PAUSE ? 0 : reducedMotion.matches ? SPEED * 0.35 : SPEED;
    walked += speed * dt;
    camera.position.z = -walked;
    if (BOB) {
      const phase = walked / 0.75 * Math.PI * 2;
      camera.position.y = EYE + Math.sin(phase) * 0.022;
      camera.position.x = Math.sin(phase / 2) * 0.012;
    }
    for (const seg of segments) if (seg.z0 > camera.position.z + 1) { seg.z0 -= SEGS * SEG_L; buildSegment(seg); }
    // outdoors only while a walkway slot is among the built ones; the lid closes the tunnel where the walls stop
    let zone = -1, far = segments[0];
    for (const seg of segments) { if (seg.walk) zone = Math.floor(slot(seg) / CYCLE); if (seg.z0 < far.z0) far = seg; }
    outPass.enabled = zone >= 0 && !pmndrs;
    if (zone >= 0) outside.position.z = zoneExit(zone);
    cap.visible = !far.walk;
    cap.position.z = far.z0;
    sky.position.copy(camera.position);

    aim.lerp(aimGoal, 1 - Math.exp(-dt / 0.08)); // ~0.25 s to settle
    const tanV = Math.tan(camera.fov * DEG / 2);
    dir.set(aim.x * tanV * camera.aspect, aim.y * tanV, -1).normalize();
    target.copy(camera.position).addScaledVector(dir, hitTunnel(camera.position, dir));
    local.copy(target).sub(camera.position);   // hand space = camera space (the camera never rotates)
    hand.updateMatrixWorld();
    torch.lookAt(local);
    if (grip) {
      wristQ.copy(torch.quaternion).multiply(grip.q);                 // wrist pose in hand space, set by the torch
      wristPos.copy(grip.p).applyQuaternion(torch.quaternion);
      dirV.copy(wristPos).sub(ELBOW).normalize();
      // forearm along dirV, twisted to match the hand so the wrist doesn't wring
      handX.set(1, 0, 0).applyQuaternion(wristQ);
      handX.addScaledVector(dirV, -handX.dot(dirV)).normalize();
      basis.makeBasis(handX, dirV, zV.crossVectors(handX, dirV));
      grip.fore.quaternion.setFromRotationMatrix(basis);
      grip.fore.position.copy(wristPos).addScaledVector(dirV, -grip.lenF);
      grip.wrist.quaternion.copy(grip.fore.quaternion).invert().multiply(wristQ);
      grip.bicep.quaternion.setFromUnitVectors(Y, SHOULDER_TO_ELBOW); // upper arm out of sight, down and behind
      grip.bicep.position.copy(grip.fore.position).addScaledVector(SHOULDER_TO_ELBOW, -grip.lenB);
      grip.shoulder.quaternion.copy(grip.bicep.quaternion);
      grip.shoulder.position.copy(grip.bicep.position).addScaledVector(SHOULDER_TO_ELBOW, -grip.lenS);
    }
    torch.updateMatrixWorld();
    head.copy(HEAD).applyMatrix4(torch.matrixWorld).add(camera.position);
    beam.position.copy(head); spill.position.copy(head); bounce.position.copy(camera.position);
    beam.target.position.copy(target); spill.target.position.copy(target);
    beam2.position.copy(head); spill2.position.copy(head); beam2.target.position.copy(target); spill2.target.position.copy(target);

    fade = Math.min(1, fade + dt / 1.4);
    U.uFade.value = fade * fade;
    (pmndrs ? pmndrs.composer : composer).render(dt);
  }
  function update() {
    const go = visible && onScreen;
    if (go && !running) { running = true; last = performance.now(); raf = requestAnimationFrame(frame); }
    else if (!go && running) { running = false; cancelAnimationFrame(raf); }
  }
  document.addEventListener('visibilitychange', () => { visible = !document.hidden; update(); });
  new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; update(); }).observe(canvas);
  update();
  setTimeout(() => { if (!touched) msg.hidden = false; }, 1600);
}
</script>
</body>
</html>
