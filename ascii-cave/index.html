<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCII 洞窟</title>
<meta name="description" content="拿著手電筒走進一條沒有盡頭的鐵道隧道，整個畫面用 ASCII 字元畫出來，牆上貼滿在亞美尼亞拍到的塗鴉。點一下畫面，光就照過去。">
<meta property="og:type" content="website">
<meta property="og:title" content="ASCII 洞窟">
<meta property="og:description" content="拿著手電筒走進一條沒有盡頭的鐵道隧道，整個畫面用 ASCII 字元畫出來，牆上貼滿在亞美尼亞拍到的塗鴉。">
<meta property="og:image" content="https://gassao1998.github.io/ascii-cave/preview.jpg">
<meta name="theme-color" content="#000000">
<style>
  /* the work is black in both themes; the blocks below only restate it so either theme stamp resolves */
  :root {
    --bg: #000;
    --hint: rgba(232, 226, 210, 0.34);
    --text: #d8d2c4;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #000; --hint: rgba(232, 226, 210, 0.34); --text: #d8d2c4; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #000; --hint: rgba(232, 226, 210, 0.34); --text: #d8d2c4; color-scheme: dark; }

  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #msg {
    position: fixed; left: 0; right: 0; margin: 0; padding: 0 16px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 6vh);
    text-align: center; color: var(--hint); pointer-events: none;
    font: 13px/1.5 system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    letter-spacing: 0.14em; transition: opacity 1.2s ease;
  }
  #msg.off { opacity: 0; }
  #msg.err { color: var(--text); }
  #gyro {
    position: fixed; z-index: 1; width: 34px; height: 34px; padding: 0; border-radius: 50%;
    top: calc(env(safe-area-inset-top, 0px) + 10px); right: calc(env(safe-area-inset-right, 0px) + 10px);
    border: 1px solid rgba(232, 226, 210, 0.18); background: rgba(0, 0, 0, 0.35); color: var(--hint);
    display: grid; place-items: center; touch-action: manipulation;
  }
  #gyro[hidden] { display: none; }
  #gyro[aria-pressed="false"] { opacity: 0.45; }
  #gyro svg { width: 18px; height: 18px; }
  #safe {
    position: fixed; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.39.6/build/index.min.js"
  }
}
</script>
</head>
<body>
<canvas id="view" role="img" aria-label="ASCII 字元畫的鐵道隧道，手電筒一直往前照，點擊或觸控畫面可以改變光照的方向"></canvas>
<p id="msg" hidden>點畫面照亮</p>
<button id="gyro" type="button" hidden aria-pressed="true" aria-label="轉動手機看四周：點一下關掉，再點一下從現在的方向重新對準">
  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
    <rect x="7" y="4" width="6" height="12" rx="1.2"/><path d="M3.5 7.5a7 7 0 0 0 0 5M16.5 7.5a7 7 0 0 1 0 5"/>
  </svg>
</button>
<div id="safe"></div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { SimplexNoise } from 'three/addons/math/SimplexNoise.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const canvas = document.getElementById('view');
const msg = document.getElementById('msg');
const safeProbe = document.getElementById('safe');
const params = new URLSearchParams(location.search);

function fail() {
  msg.textContent = '這個瀏覽器無法顯示這件作品，需要支援 WebGL 2 的瀏覽器。';
  msg.className = 'err';
  msg.hidden = false;
}
if (!document.createElement('canvas').getContext('webgl2')) fail();
else start().catch((e) => { console.error(e); fail(); });

async function start() {
  // ---------- constants ----------
  const R = 2.3, HW = 2.0, S = 2 * HW + Math.PI * R;   // tunnel half width, wall height, profile length
  const NS = 72, DS = S / NS;                          // samples around the arch
  // segment layout: three 12 m segments behind (so turning round still finds walls), six ahead
  const DZ = 0.25, SEG_L = 12, NZ = SEG_L / DZ, BEHIND = 3, SEGS = BEHIND + 6;
  const EYE = 1.6, SPEED = 1.15;                       // eye height, walk speed (m/s)
  // scene texels per cell side; by default 1 for the 3-4 px cells, which are nearly pixels already (README has the numbers)
  const K_FORCED = [1, 2, 3, 4].includes(Number(params.get('k'))) ? Number(params.get('k')) : 0;
  const CHARS = ' .:-=+*#%@';
  // assets/graffiti/*.jpg, cropped by tools/crop_graffiti.py; the first four are placed specially
  const GRAFFITI = ['cat-band', 'mural-sun', 'mural-dish', 'poster', 'lilac', 'blue', 'bfd', 'code', 'yellow-e', 'love', 'fists',
    'green', 'pillar', 'scam', 'mos-erevan', 'suka', 'gey', 'throw-green', 'green-saints', 'shutter',
    'tugan', 'underpass-l', 'underpass-cat', 'underpass-teal', 'underpass-lilac', 'make-love', 'protect-trans', 'portal-red',
    'portal-tags', 'orange', 'tasma', 'fuck-you', 'column', 'card', 'kiss', 'eyes'];
  // paint lifted off rock, a shutter, tiles or white plaster: PNG with only the strokes opaque, so it sits on the wall
  const KEYED = new Set(['cat-band', 'make-love', 'protect-trans', 'shutter', 'tugan', 'fuck-you', 'scam']);
  const START = Math.max(0, Number(params.get('at')) || 0); // ?at=metres starts further in; ?pause=1 stands still
  const PAUSE = params.get('pause') === '1';
  const BOB = params.get('bob') !== '0'; // a slight walking bob; ?bob=0 turns it off, and reduced motion does too
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const DEG = Math.PI / 180;

  // ---------- renderer & passes ----------
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
  renderer.setClearColor(0x000000, 1);

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x000000, 6, 40);
  const camera = new THREE.PerspectiveCamera(60, 1, 0.05, 1500); // far enough for the sky outside
  camera.position.set(0, EYE, 0);

  const handScene = new THREE.Scene();
  const handCamera = new THREE.PerspectiveCamera(60, 1, 0.01, 5);

  const asciiShader = {
    uniforms: {
      tDiffuse: { value: null },
      tGlyph: { value: null },
      uGrid: { value: new THREE.Vector2(1, 1) },
      uOffset: { value: new THREE.Vector2() },
      uTexel: { value: new THREE.Vector2() },
      uCell: { value: 8 },
      uFade: { value: 0 },
      uRaw: { value: params.get('ascii') === '0' ? 1 : 0 }, // ?ascii=0 shows the scene behind the characters
    },
    vertexShader: /* glsl */`
      void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }`,
    fragmentShader: /* glsl */`
      uniform sampler2D tDiffuse;
      uniform sampler2D tGlyph;
      uniform vec2 uGrid, uOffset, uTexel;
      uniform float uCell, uFade, uRaw;
      const float N = ${CHARS.length}.0;
      void main() {
        vec2 p = gl_FragCoord.xy + uOffset;
        vec2 cell = floor(p / uCell);
        vec2 local = (p - cell * uCell) / uCell;
        vec2 uv = (cell + 0.5) / uGrid;
        // four bilinear taps = box average of the cell's 4x4 scene texels (steadier than one sample)
        vec3 c = texture2D(tDiffuse, uv - uTexel).rgb + texture2D(tDiffuse, uv + uTexel).rgb
               + texture2D(tDiffuse, uv + vec2(uTexel.x, -uTexel.y)).rgb + texture2D(tDiffuse, uv + vec2(-uTexel.x, uTexel.y)).rgb;
        // tone-map the luminance only (Reinhard), so paint inside the hot spot keeps its hue and some contrast
        float lin = dot(c, vec3(0.2126, 0.7152, 0.0722)), t = lin * 0.5;
        c = min(c * (t / (1.0 + t)) / max(lin, 1e-5), 1.0);
        c = pow(c, vec3(1.0 / 2.2)) * uFade;     // perceptual space: glyph density follows what the eye sees
        float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
        float idx = min(floor(l * N * 1.08), N - 1.0); // darkest tenth stays empty: unlit rock is black
        float m = texture2D(tGlyph, vec2((idx + local.x) / N, local.y)).r;
        float peak = max(max(c.r, c.g), max(c.b, 1e-3));
        vec3 col = c * min(1.0 / peak, (0.35 + 0.65 * l) / max(l, 1e-3)); // dim glyphs keep their hue, never clip it
        gl_FragColor = vec4(mix(col * m, c, uRaw), 1.0);
      }`,
  };

  const composer = new EffectComposer(renderer);
  composer.setPixelRatio(1); // its targets are sized in scene texels (K per character cell), not screen pixels
  composer.addPass(new RenderPass(scene, camera));
  // the ROT-54 walkway outside: its own scene (moonlight must not reach into the tunnel), drawn over the same
  // depth buffer so tunnel walls and the outdoors hide each other correctly; only on while a walkway is near
  const outScene = new THREE.Scene();
  const outPass = new RenderPass(outScene, camera);
  outPass.clear = false;
  outPass.enabled = false;
  composer.addPass(outPass);
  const handPass = new RenderPass(handScene, handCamera);
  handPass.clear = false;
  handPass.clearDepth = true; // the hand is never hidden by the tunnel
  composer.addPass(handPass);
  const asciiPass = new ShaderPass(asciiShader);
  composer.addPass(asciiPass);
  const U = asciiPass.uniforms;

  // ?ascii=pmndrs swaps in the postprocessing package's ASCIIEffect; kept only to compare with the shader above (see README)
  const pmndrs = params.get('ascii') === 'pmndrs' ? await (async () => {
    const PP = await import('postprocessing');
    const pc = new PP.EffectComposer(renderer, { frameBufferType: THREE.HalfFloatType });
    pc.addPass(new PP.RenderPass(scene, camera));
    const hp = new PP.RenderPass(handScene, handCamera);
    hp.clearPass.setClearFlags(false, true, false);
    pc.addPass(hp);
    pc.addPass(new PP.EffectPass(camera, new PP.ToneMappingEffect()));
    const fx = new PP.ASCIIEffect({ asciiTexture: new PP.ASCIITexture({ characters: CHARS }) });
    pc.addPass(new PP.EffectPass(camera, fx));
    return { composer: pc, fx };
  })() : null;

  // ---------- lights ----------
  scene.add(new THREE.AmbientLight(0xc4cad8, 0.008));
  const beam = new THREE.SpotLight(0xfff0dc, 85, 0, 0.34, 0.6, 1.6);   // hot spot with a soft edge
  const spill = new THREE.SpotLight(0xfff0dc, 3.4, 0, 0.75, 1, 1.6);   // the dim halo around it
  const bounce = new THREE.PointLight(0xc8ccd8, 0.5, 0, 2);            // light thrown back by the walls: faint near you, gone far away
  scene.add(beam, beam.target, spill, spill.target, bounce);

  // ---------- tunnel walls ----------
  const simplex = new SimplexNoise();
  const fbm = (x, y) => simplex.noise(x, y) * 0.62 + simplex.noise(x * 2.3, y * 2.3) * 0.28 + simplex.noise(x * 5.1, y * 5.1) * 0.1;
  const prof = { x: 0, y: 0, nx: 0, ny: 0 };
  function profile(s) { // ideal cross-section point and outward normal at arc length s (left floor -> arch -> right floor)
    if (s < HW) { prof.x = -R; prof.y = s; prof.nx = -1; prof.ny = 0; }
    else if (s > S - HW) { prof.x = R; prof.y = S - s; prof.nx = 1; prof.ny = 0; }
    else { const a = Math.PI - (s - HW) / R; prof.nx = Math.cos(a); prof.ny = Math.sin(a); prof.x = R * prof.nx; prof.y = HW + R * prof.ny; }
  }

  const GW = NS + 3, GH = NZ + 3;  // padded grid (one extra ring all round for normals)
  const wallIndex = (() => {
    const idx = new Uint16Array(NS * NZ * 6);
    let k = 0;
    for (let j = 0; j < NZ; j++) for (let i = 0; i < NS; i++) {
      const a = j * (NS + 1) + i, b = a + 1, c = a + NS + 1, d = c + 1;
      idx.set([a, b, c, b, d, c], k); k += 6;
    }
    return new THREE.BufferAttribute(idx, 1);
  })();
  const wallMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95 });

  // ---------- graffiti atlas ----------
  const images = (await Promise.all(GRAFFITI.map(async (name) => {
    const img = new Image();
    img.crossOrigin = 'anonymous'; // opened from file:// the pictures fail to load instead of breaking WebGL
    img.src = `assets/graffiti/${name}.${KEYED.has(name) ? 'png' : 'jpg'}`;
    try { await img.decode(); return { name, img }; } catch { return null; }
  }))).filter(Boolean);
  const AW = 2048, PAD = 4;
  images.sort((a, b) => b.img.height - a.img.height);
  let ax = 0, ay = 0, rowH = 0;
  for (const e of images) {           // shelf packing
    if (ax + e.img.width > AW) { ax = 0; ay += rowH + PAD; rowH = 0; }
    e.x = ax; e.y = ay; ax += e.img.width + PAD; rowH = Math.max(rowH, e.img.height);
  }
  const AH = Math.max(1, ay + rowH);
  const fit = Math.min(1, 4096 / AH);  // phones cap textures at 4096 px; shrinking the whole atlas keeps every uv
  const atlasCanvas = document.createElement('canvas');
  atlasCanvas.width = Math.round(AW * fit); atlasCanvas.height = Math.round(AH * fit);
  const actx = atlasCanvas.getContext('2d', { willReadFrequently: true });
  actx.scale(fit, fit);
  for (const e of images) actx.drawImage(e.img, e.x, e.y); // PNGs (the cat, keyed paint) keep their transparency
  const atlas = new THREE.CanvasTexture(atlasCanvas);
  atlas.colorSpace = THREE.SRGBColorSpace;
  atlas.anisotropy = 4;
  const pieces = images.map((e) => ({
    name: e.name, aspect: e.img.width / e.img.height,
    u0: (e.x + 1) / AW, du: (e.img.width - 2) / AW, v0: 1 - (e.y + e.img.height - 1) / AH, dv: (e.img.height - 2) / AH,
  }));
  const special = Object.fromEntries(['cat-band', 'mural-sun', 'mural-dish', 'poster'].map((n) => [n, pieces.find((p) => p.name === n)]));
  const others = pieces.filter((p) => !Object.values(special).includes(p));
  const decalMat = new THREE.MeshStandardMaterial({
    map: atlas, vertexColors: true, transparent: true, depthWrite: false, roughness: 0.85,
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
  });

  // ---------- segments (rebuilt in place when they fall behind, nothing allocated afterwards) ----------
  const DECAL_VERTS = 6000, DECAL_INDEX = 36000;
  const Z_FIRST = 4 - SEG_L * (1 + Math.floor(START / SEG_L)); // far end of the first segment ahead
  const slot = (seg) => Math.round((4 - SEG_L - seg.z0) / SEG_L); // world-fixed segment number
  // 156 m of tunnel, then 84 m outside on the ROT-54 walkway, and again; walkway slots build no tunnel
  // the 120 m outside: 12 m of open ground with the track at each portal, the walkway in between
  const TUNNEL_SLOTS = 13, WALK_SLOTS = 10, CYCLE = TUNNEL_SLOTS + WALK_SLOTS;
  const isWalk = (n) => n % CYCLE >= TUNNEL_SLOTS;
  const isGround = (n) => n % CYCLE === TUNNEL_SLOTS || n % CYCLE === CYCLE - 1;
  // the carpet stretch: slot 7 of each cycle (84-96 m in), where no cat, mural or poster falls in the first cycle. One
  // segment, so the seven rugs cropped off the photos fill each wall with no two alike side by side
  const CARPET_SLOT = 7, CARPET_LEN = SEG_L;
  const isCarpet = (n) => { const m = ((n % CYCLE) + CYCLE) % CYCLE; return m >= CARPET_SLOT && m < CARPET_SLOT + CARPET_LEN / SEG_L; };
  const zoneExit = (k) => 4 - SEG_L * (TUNNEL_SLOTS + CYCLE * k); // z where the k-th walkway leaves the tunnel
  let bag = [];
  const rand = (a, b) => a + Math.random() * (b - a);
  const nextPiece = () => { if (!bag.length) bag = others.slice().sort(() => Math.random() - 0.5); return bag.pop(); };
  const PIN = pieces.find((p) => p.name === params.get('pin'));

  const segments = Array.from({ length: SEGS }, (_, k) => {
    const wall = new THREE.BufferGeometry();
    for (const [name, size] of [['position', 3], ['normal', 3], ['color', 3]]) {
      wall.setAttribute(name, new THREE.BufferAttribute(new Float32Array((NS + 1) * (NZ + 1) * size), size).setUsage(THREE.DynamicDrawUsage));
    }
    wall.setIndex(wallIndex);
    const decal = new THREE.BufferGeometry();
    for (const [name, size] of [['position', 3], ['normal', 3], ['uv', 2], ['color', 4]]) {
      decal.setAttribute(name, new THREE.BufferAttribute(new Float32Array(DECAL_VERTS * size), size).setUsage(THREE.DynamicDrawUsage));
    }
    decal.setIndex(new THREE.BufferAttribute(new Uint16Array(DECAL_INDEX), 1).setUsage(THREE.DynamicDrawUsage));
    const seg = {
      z0: Z_FIRST - (k - BEHIND) * SEG_L, P: new Float32Array(GW * GH * 3), N: new Float32Array(GW * GH * 3),
      wall: new THREE.Mesh(wall, wallMat), decal: new THREE.Mesh(decal, decalMat), nv: 0, ni: 0,
    };
    seg.wall.frustumCulled = seg.decal.frustumCulled = false; // rebuilt in place, bounds would go stale
    scene.add(seg.wall, seg.decal);
    buildSegment(seg);
    return seg;
  });

  function buildSegment(seg) {
    seg.walk = isWalk(slot(seg));
    seg.wall.visible = seg.decal.visible = !seg.walk;
    if (seg.track) placeTrack(seg);
    if (seg.walk) return;
    const { P, N } = seg;
    for (let j = -1; j <= NZ + 1; j++) {
      const z = seg.z0 + j * DZ;
      for (let i = -1; i <= NS + 1; i++) {
        const s = i * DS;
        profile(s);
        const y = prof.y;
        const amp = y < 0.15 ? 0 : Math.min(1, (y - 0.15) / 0.5) * (y < HW ? 0.05 : 0.05 + 0.12 * Math.min(1, (y - HW) / 0.8));
        const d = amp * fbm(s * 0.75, z * 0.75);
        const k = ((j + 1) * GW + i + 1) * 3;
        P[k] = prof.x + prof.nx * d; P[k + 1] = y + prof.ny * d; P[k + 2] = z;
      }
    }
    for (let j = 0; j <= NZ; j++) for (let i = 0; i <= NS; i++) { // central-difference normals, pointing into the tunnel
      const k = ((j + 1) * GW + i + 1) * 3, ip = k + 3, im = k - 3, jp = k + GW * 3, jm = k - GW * 3;
      const ax_ = P[ip] - P[im], ay_ = P[ip + 1] - P[im + 1], az_ = P[ip + 2] - P[im + 2];
      const bx = P[jp] - P[jm], by = P[jp + 1] - P[jm + 1], bz = P[jp + 2] - P[jm + 2];
      let nx = ay_ * bz - az_ * by, ny = az_ * bx - ax_ * bz, nz = ax_ * by - ay_ * bx;
      const l = Math.hypot(nx, ny, nz) || 1;
      N[k] = nx / l; N[k + 1] = ny / l; N[k + 2] = nz / l;
    }
    const { position: pos, normal: nor, color: col } = seg.wall.geometry.attributes;
    const pa = pos.array, na = nor.array, ca = col.array;
    let v = 0;
    for (let j = 0; j <= NZ; j++) for (let i = 0; i <= NS; i++, v += 3) {
      const k = ((j + 1) * GW + i + 1) * 3;
      pa[v] = P[k]; pa[v + 1] = P[k + 1]; pa[v + 2] = P[k + 2];
      na[v] = N[k]; na[v + 1] = N[k + 1]; na[v + 2] = N[k + 2];
      const y = P[k + 1], s = i * DS;
      const base = y < HW ? 0.32 : 0.32 - 0.08 * Math.min(1, (y - HW) / 1.2);
      const b = base * (0.7 + 0.4 * simplex.noise(s * 0.33 + 40, P[k + 2] * 0.22)) * (y < 0.6 ? 0.55 + 0.75 * y : 1);
      ca[v] = b; ca[v + 1] = b * 0.96; ca[v + 2] = b * 0.9;
    }
    pos.needsUpdate = nor.needsUpdate = col.needsUpdate = true;
    placeGraffiti(seg);
  }

  function placeGraffiti(seg) {
    seg.nv = seg.ni = 0;
    const n = slot(seg), top = seg.z0 + SEG_L - rand(0.05, 0.6);
    const cat = special['cat-band'], sun = special['mural-sun'], dish = special['mural-dish'], poster = special.poster;
    if (isCarpet(n)) { // the rugs cover these walls: no graffiti, and the cat or a mural waits for another stretch
    } else if (PIN && n === Math.floor(START / SEG_L)) { // ?pin=name: that piece on the right wall a few metres ahead (checks)
      const H = 1.5, L = H * PIN.aspect, zc = seg.z0 + (SEG_L - L) / 2 - 2;
      addDecal(seg, 1, 0.4, 0.4 + H, zc, zc + L, PIN, 1.2);
      fill(seg, 1, zc + L + 0.4, top); fill(seg, 1, seg.z0 + 0.1, zc - 0.4); fill(seg, -1, seg.z0 + 0.1, top);
    } else if (n % CYCLE === TUNNEL_SLOTS - 1 && poster) { // the last stretch before the walkway: the tour poster from ROT-54,
      const H = 1.7, L = H * poster.aspect, zc = seg.z0 + (SEG_L - L) / 2, y0 = 0.3; // person-sized, on the upright wall
      addDecal(seg, 1, y0, y0 + H, zc, zc + L, poster, 1.1);
      fill(seg, 1, zc + L + 0.5, top); fill(seg, 1, seg.z0 + 0.1, zc - 0.5); fill(seg, -1, seg.z0 + 0.1, top);
    } else if (n % 4 === 1 && cat) { // every 48 m the cat lies across the arch; the walls under it stay bare
      const zc = seg.z0 + SEG_L / 2;
      addBand(seg, cat, zc - 2, zc + 2, 1.5);
      for (const side of [-1, 1]) { fill(seg, side, zc + 2.4, top); fill(seg, side, seg.z0 + 0.1, zc - 2.4); }
    } else if (n % 6 === 3 && sun && dish) { // every 72 m the control-room mural, laid out as on its wall
      const side = Math.floor(n / 6) % 2 ? 1 : -1, H = 1.7, L = H * sun.aspect, H2 = H * 0.86, L2 = H2 * dish.aspect;
      const zc = seg.z0 + rand(0.8, SEG_L - L - 0.8), yd = 0.15, ys = yd + H2;
      addDecal(seg, side, ys, ys + H, zc, zc + L, sun, 1.15);
      const zd = side < 0 ? zc : zc + L - L2; // the dish part sits under the right-hand end of the band
      addDecal(seg, side, yd, ys, zd, zd + L2, dish, 1.15);
      fill(seg, side, zc + L + 0.3, top);
      fill(seg, side, seg.z0 + 0.1, zc - 0.3);
      fill(seg, -side, seg.z0 + 0.1, top);
    } else {
      for (const side of [-1, 1]) fill(seg, side, seg.z0 + 0.1, top);
    }
    const g = seg.decal.geometry;
    for (const name of ['position', 'normal', 'uv', 'color']) g.attributes[name].needsUpdate = true;
    g.index.needsUpdate = true;
    g.setDrawRange(0, seg.ni);
  }

  function fill(seg, side, zMin, zMax) { // dense, random wall of pieces between zMin and zMax
    let z = zMax;
    while (others.length) {
      const p = nextPiece();
      let h = rand(1.3, 2.0), w = h * p.aspect;
      if (w > 3.8) { w = 3.8; h = w / p.aspect; }
      if (z - w < zMin) break;
      const y0 = rand(0.2, 0.45);
      addDecal(seg, side, y0, y0 + h, z - w, z, p, rand(1.05, 1.35));
      if (Math.random() < 0.45) { // a smaller piece higher up, where the arch starts
        const q = nextPiece(), qh = Math.min(rand(0.7, 1.0), w / q.aspect), qw = qh * q.aspect, qz = z - rand(0, w - qw);
        addDecal(seg, side, y0 + h + 0.1, y0 + h + 0.1 + qh, qz - qw, qz, q, rand(0.95, 1.2));
      }
      z -= w + rand(0.05, 0.45);
    }
  }

  // The cat strip (tools/crop_graffiti.py cat_band) is the arch unrolled: across = the tunnel profile from the
  // left floor over the ceiling to the right floor, down = along the tunnel, nearest edge first. Laid on the
  // wall grid it puts the hind feet, haunch and tail on the left wall, the body along the ceiling and the head
  // and front paws on the right; a white outline filled black, transparent round it (a PNG).
  function addBand(seg, p, zA, zB, tint) {
    const j0 = Math.max(0, Math.round((zA - seg.z0) / DZ)), j1 = Math.min(NZ, Math.round((zB - seg.z0) / DZ));
    const nj = j1 - j0 + 1, ni = NS + 1;
    if (nj < 2 || seg.nv + ni * nj > DECAL_VERTS || seg.ni + (ni - 1) * (nj - 1) * 6 > DECAL_INDEX) return;
    const g = seg.decal.geometry, pos = g.attributes.position.array, nor = g.attributes.normal.array;
    const uv = g.attributes.uv.array, col = g.attributes.color.array, idx = g.index.array;
    const base = seg.nv;
    for (let j = j0; j <= j1; j++) for (let i = 0; i <= NS; i++) {
      const k = ((j + 1) * GW + i + 1) * 3, v = seg.nv++;
      for (let c = 0; c < 3; c++) { pos[v * 3 + c] = seg.P[k + c] + seg.N[k + c] * 0.03; nor[v * 3 + c] = seg.N[k + c]; }
      uv[v * 2] = p.u0 + (i / NS) * p.du;                                 // left floor -> right floor
      uv[v * 2 + 1] = p.v0 + ((j - j0) / (j1 - j0)) * p.dv;               // far edge -> near edge (strip bottom -> top)
      col[v * 4] = col[v * 4 + 1] = col[v * 4 + 2] = tint;
      col[v * 4 + 3] = j === j0 || j === j1 ? 0 : 1;
    }
    for (let j = 0; j < nj - 1; j++) for (let i = 0; i < ni - 1; i++) {
      const a = base + j * ni + i, c = a + ni, m = seg.ni;
      idx[m] = a; idx[m + 1] = a + 1; idx[m + 2] = c; idx[m + 3] = a + 1; idx[m + 4] = c + 1; idx[m + 5] = c;
      seg.ni += 6;
    }
  }

  function addDecal(seg, side, y0, y1, zA, zB, p, tint) {
    // decal follows the wall grid exactly (same samples), lifted 3 cm along the normal
    const s0 = side < 0 ? y0 : S - y1, s1 = side < 0 ? y1 : S - y0;
    const i0 = Math.round(s0 / DS), i1 = Math.round(s1 / DS);
    const j0 = Math.max(0, Math.round((zA - seg.z0) / DZ)), j1 = Math.min(NZ, Math.round((zB - seg.z0) / DZ));
    const ni = i1 - i0 + 1, nj = j1 - j0 + 1;
    if (ni < 3 || nj < 3 || seg.nv + ni * nj > DECAL_VERTS || seg.ni + (ni - 1) * (nj - 1) * 6 > DECAL_INDEX) return;
    const g = seg.decal.geometry, pos = g.attributes.position.array, nor = g.attributes.normal.array;
    const uv = g.attributes.uv.array, col = g.attributes.color.array, idx = g.index.array;
    const base = seg.nv;
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const k = ((j + 1) * GW + i + 1) * 3, v = seg.nv++;
      for (let c = 0; c < 3; c++) { pos[v * 3 + c] = seg.P[k + c] + seg.N[k + c] * 0.03; nor[v * 3 + c] = seg.N[k + c]; }
      const fz = (j - j0) / (j1 - j0), fs = (i - i0) / (i1 - i0);
      const u = side < 0 ? 1 - fz : fz, w = side < 0 ? fs : 1 - fs; // text reads left-to-right from the tunnel
      uv[v * 2] = p.u0 + u * p.du; uv[v * 2 + 1] = p.v0 + w * p.dv;
      col[v * 4] = col[v * 4 + 1] = col[v * 4 + 2] = tint;
      col[v * 4 + 3] = i === i0 || i === i1 || j === j0 || j === j1 ? 0 : 1; // edges fade out
    }
    for (let j = 0; j < nj - 1; j++) for (let i = 0; i < ni - 1; i++) {
      const a = base + j * ni + i, c = a + ni, n = seg.ni;
      idx[n] = a; idx[n + 1] = a + 1; idx[n + 2] = c; idx[n + 3] = a + 1; idx[n + 4] = c + 1; idx[n + 5] = c;
      seg.ni += 6;
    }
  }

  // ---------- track: one 12 m piece (floor, rails, sleepers) shared by every tunnel segment ----------
  // Abandoned: rusty rails with patchy polish on top; uneven, skewed, broken and missing sleepers; gravel and dirt
  // drifted over them. Everything random is a function of z modulo the period, so the pieces join seamlessly.
  const TRACK_P = 12, TAU = Math.PI * 2;
  const wrapZ = (z) => ((z % TRACK_P) + TRACK_P) % TRACK_P;
  const pnoise = (x, z, f) => { // simplex noise that repeats every TRACK_P along z
    const r = TRACK_P * f / TAU, a = z * TAU / TRACK_P;
    return simplex.noise3d(x * f, Math.cos(a) * r, Math.sin(a) * r);
  };
  const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  const RUST = [0.3, 0.12, 0.055], POLISH = [0.74, 0.72, 0.68];
  const trackMesh = (() => {
    const zNear = TRACK_P, len = TRACK_P, parts = []; // local z 0..12, placed at each segment's z0
    const paint = (g, colour) => { // colour(x, y, z) -> [r, g, b]
      const p = g.attributes.position.array, c = new Float32Array(p.length);
      for (let i = 0; i < p.length; i += 3) c.set(colour(p[i], p[i + 1], p[i + 2]), i);
      g.setAttribute('color', new THREE.BufferAttribute(c, 3));
      parts.push(g);
    };
    // floor: gravel speckle, dirt drifts in patches and piled against the walls, high enough to bury some sleepers
    const floor = new THREE.PlaneGeometry(2 * R + 0.8, len, 28, Math.round(len / 0.2));
    floor.rotateX(-Math.PI / 2).translate(0, 0, zNear - len / 2);
    const fp = floor.attributes.position.array;
    for (let i = 0; i < fp.length; i += 3) {
      const x = fp[i], z = fp[i + 2];
      fp[i + 1] = Math.max(0, pnoise(x, z, 0.5) * 0.1 - 0.015) + Math.max(0, Math.abs(x) - 1.6) * 0.09
        + hash(Math.round(x * 12) * 17.3 + Math.round(wrapZ(z) * 9)) * 0.012;
    }
    floor.computeVertexNormals();
    paint(floor, (x, y, z) => {
      const g = 0.1 + 0.09 * hash(Math.round(x * 12) * 3.7 + Math.round(wrapZ(z) * 9) * 1.3), d = Math.min(1, y * 9);
      return [g + 0.05 * d, g * 0.92 + 0.02 * d, g * 0.8];  // grey gravel, browner where the dirt piles up
    });
    // sleepers: 20 slots per period; each slot's hash picks missing, broken, skew, shift, sink and colour
    for (let k = 0, z0 = zNear - 0.3; z0 > zNear - len; k++, z0 -= 0.6) {
      const s = k % 20, h = (n) => hash(s * 13.1 + n);
      if (h(1) < 0.09) continue;                                          // missing
      const z = z0 + (h(2) - 0.5) * 0.14, yaw = (h(3) - 0.5) * 0.22, sink = h(4) * 0.05;
      const wood = 0.08 + 0.09 * h(5), grey = h(6);
      const colour = () => [wood * (1.25 - 0.2 * grey), wood * (0.85 + 0.1 * grey), wood * (0.55 + 0.3 * grey)];
      const pieces = h(7) < 0.14 ? [[-0.4, 0.7, 0.06], [0.42, 0.64, -0.09]] : [[0, 1.5, 0]]; // broken in two, one end tipped
      for (const [cx, w, tilt] of pieces) {
        const g = new THREE.BoxGeometry(w, 0.08, 0.22).rotateZ(tilt).rotateY(yaw).translate(cx, 0.03 - sink, z);
        paint(g, colour);
      }
    }
    // rails: rusty, uneven brown sides; the top keeps broken streaks of polish
    for (const x of [-0.41, 0.41]) { // 750 mm narrow gauge, like the Yerevan children's railway (docs/tunnel-reference.md)
      const n = Math.round(len / 0.25);
      paint(new THREE.BoxGeometry(0.07, 0.11, len, 1, 1, n).translate(x, 0.125, zNear - len / 2), (px, py, pz) => {
        const r = 0.6 + 0.4 * pnoise(px * 4, pz, 1.4);
        return [RUST[0] * r * 1.1, RUST[1] * r, RUST[2] * r];
      });
      paint(new THREE.BoxGeometry(0.075, 0.02, len, 1, 1, n).translate(x, 0.19, zNear - len / 2), (px, py, pz) => {
        const t = THREE.MathUtils.smoothstep(pnoise(px + 9, pz, 0.9), 0.1, 0.4);
        return RUST.map((c, i) => c + (POLISH[i] - c) * t);
      });
    }
    const geo = mergeGeometries(parts), mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9 });
    return () => { const m = new THREE.Mesh(geo, mat); m.frustumCulled = false; scene.add(m); return m; };
  })();
  for (const seg of segments) { seg.track = trackMesh(); placeTrack(seg); }
  function placeTrack(seg) { seg.track.position.z = seg.z0; seg.track.visible = !seg.walk || isGround(slot(seg)); }

  // black lid on the far end of the built tunnel, so the outdoors never shows through where the walls stop
  const cap = new THREE.Mesh(new THREE.PlaneGeometry(16, 12).translate(0, 4, 0), new THREE.MeshBasicMaterial({ color: 0 }));
  scene.add(cap);

  // ---------- the carpet stretch: two segments of every cycle lined with Armenian rugs (carpets/IMG_6744, IMG_7326) ----------
  // Rugs hang on both walls, sagging, some crooked or with a corner come loose, and lie in heaps along them: folded
  // stacks, flattened rolls, one slid down and spread on the floor. The pictures are rugs cropped off photos and aged
  // (tools/crop_graffiti.py, rug-*); one material and one draw call for the lot; only the torch lights them.
  const carpets = await (async () => {
    const imgs = (await Promise.all(['horses', 'crosses', 'diamonds', 'medallion', 'stripes', 'hexagons', 'tan'].map(async (n) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = `assets/graffiti/rug-${n}.jpg`;
      try { await img.decode(); return img; } catch { return null; }
    }))).filter(Boolean);
    if (!imgs.length) return null;
    const c = document.createElement('canvas');
    c.width = imgs.reduce((s, i) => s + i.width, 0); c.height = Math.max(...imgs.map((i) => i.height));
    let ax = 0;
    const rugs = imgs.map((img) => {
      c.getContext('2d').drawImage(img, ax, 0);
      const r = { u0: ax / c.width, du: img.width / c.width, v0: 1 - img.height / c.height, dv: img.height / c.height, aspect: img.width / img.height };
      ax += img.width;
      return r;
    });
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
    let seed = 6744; // the same layout every time
    const rnd = (a, b) => { seed = (seed * 16807) % 2147483647; return a + (seed / 2147483647) * (b - a); };
    const pick = (...avoid) => { // a rug picture, not one of those given (its neighbours)
      let r;
      do r = rugs[Math.floor(rnd(0, rugs.length))]; while (avoid.includes(r) && rugs.length > avoid.length);
      return r;
    };
    const fitUV = (geo, r, part = 1) => { // into one rug's rect of the atlas (part < 1: a random piece of it)
      const uv = geo.attributes.uv, du = r.du * part, dv = r.dv * part, u0 = r.u0 + rnd(0, r.du - du), v0 = r.v0 + rnd(0, r.dv - dv);
      for (let i = 0; i < uv.count; i++) uv.setXY(i, u0 + uv.getX(i) * du, v0 + uv.getY(i) * dv);
      return geo;
    };
    const across = []; // the left wall's rugs, so the one opposite is a different picture
    const parts = [];
    for (const side of [-1, 1]) {
      let prev = null;
      for (let z = -0.5, k = 0; z > -CARPET_LEN + 1.2; k++) { // hanging on the wall, side by side, a little overlapped
        const facing = side > 0 ? across.filter((a) => a.z0 > z - 1.2 && a.z1 < z + 0.2).map((a) => a.r) : [];
        const r = pick(prev, ...facing), h = rnd(1.5, 1.9), w = h * r.aspect, top = rnd(1.95, 2.15), loose = rnd(0, 1) < 0.3;
        if (side < 0) across.push({ r, z0: z, z1: z - w });
        prev = r;
        const g = fitUV(new THREE.PlaneGeometry(w, h, 6, 8), r), p = g.attributes.position;
        for (let i = 0; i < p.count; i++) {
          const u = p.getX(i) / w + 0.5, v = p.getY(i) / h + 0.5; // 0..1 across, bottom to top
          let dy = 0, dz = 0.07 * (1 - v) ** 2 * (1 - (2 * u - 1) ** 2); // the lower middle bellies out from the wall
          if (loose) { const t = Math.max(0, (u - 0.55) / 0.45) * Math.max(0, (v - 0.4) / 0.6); dy -= t * t * 0.4 * h; dz += t * 0.3; }
          p.setY(i, p.getY(i) + dy); p.setZ(i, dz);
        }
        g.rotateZ(rnd(-0.07, 0.07)).rotateY(-side * Math.PI / 2).translate(side * (R - 0.05 - (k % 2) * 0.03), top - h / 2, z - w / 2);
        g.computeVertexNormals();
        parts.push(g);
        z -= w + rnd(0, 0.4);
      }
      let last = null;
      for (let z = -0.8; z > -CARPET_LEN + 1; ) { // heaped along the foot of the wall
        const r = (last = pick(last)), kind = rnd(0, 1), x = side * rnd(1.35, 1.8);
        if (kind < 0.45) { // a stack of folded rugs, no two the same on top of each other
          let y = 0, below = null;
          const n = Math.floor(rnd(3, 8)), len = rnd(0.9, 1.3);
          for (let i = 0; i < n; i++) {
            const t = rnd(0.07, 0.12);
            parts.push(fitUV(new THREE.BoxGeometry(rnd(0.5, 0.75), t, len * rnd(0.9, 1.05)), (below = pick(below)), 0.4)
              .rotateY(rnd(-0.18, 0.18)).translate(x + rnd(-0.05, 0.05), y + t / 2, z - len / 2));
            y += t;
          }
          z -= len + rnd(0.2, 0.6);
        } else if (kind < 0.85) { // rolled up and squashed flat by its own weight
          const rad = rnd(0.11, 0.18), len = rnd(1.1, 1.9);
          parts.push(fitUV(new THREE.CylinderGeometry(rad, rad, len, 14, 1), r).rotateX(Math.PI / 2).scale(1, 0.75, 1)
            .rotateY(rnd(-0.25, 0.25)).translate(x, rad * 0.75, z - len / 2));
          z -= rnd(0.3, 0.8);
        } else { // fallen off the wall and spread across the floor, still leaning on it at the back
          const w = 1.2, len = w / r.aspect, g = fitUV(new THREE.PlaneGeometry(w, len, 6, 8), r), p = g.attributes.position;
          for (let i = 0; i < p.count; i++) {
            const u = p.getX(i) / w + 0.5;
            p.setZ(i, 0.04 * Math.sin(p.getY(i) * 5 + u * 3) + (side > 0 ? u : 1 - u) ** 3 * 0.45);
          }
          g.rotateX(-Math.PI / 2).translate(side * (R - 0.75), 0.02, z - len / 2);
          g.computeVertexNormals();
          parts.push(g);
          z -= len + rnd(0.2, 0.5);
        }
      }
    }
    const mesh = new THREE.Mesh(mergeGeometries(parts), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95, side: THREE.DoubleSide }));
    mesh.frustumCulled = false; // it is moved along with the cycle
    scene.add(mesh);
    return mesh;
  })();

  // ---------- outside: the ROT-54 walkway (docs/rot54-reference.md); local z = 0 is the tunnel exit ----------
  const WALK_L = WALK_SLOTS * SEG_L, GROUND_L = SEG_L, RIM_Y = -1.6, DISH = { x: 28.5, z: -60, r: 27, R: 48 };
  const WALK_A = -GROUND_L, WALK_B = -WALK_L + GROUND_L; // the walkway runs between these (local z)
  // deck height along the walkway: six steps up at the start, six down at the end (0.18 m rise, 0.5 m run)
  const STEP_RUN = 0.5, STEP_RISE = 0.18, FLIGHT = 6, DECK_TOP = STEP_RISE * FLIGHT;
  const deckY = (z) => z > WALK_A || z < WALK_B ? 0
    : STEP_RISE * Math.min(FLIGHT, Math.floor((WALK_A - z) / STEP_RUN) + 1, Math.floor((z - WALK_B) / STEP_RUN) + 1);
  const DISH_CY = RIM_Y + Math.sqrt(DISH.R ** 2 - DISH.r ** 2);
  const dishY = (r) => DISH_CY - Math.sqrt(DISH.R ** 2 - Math.min(r, DISH.r) ** 2);
  const smooth = THREE.MathUtils.smoothstep;
  // the dish leans 30 deg down toward the walkway, its mouth turned to you and the far rim raised, as the photos look
  // into it (IMG_7383-7385; the hanging tower plumb). Bowl, rim and the three legs tip about the point where the
  // walkway passes the rim, so nothing moves there; the tower only shifts with the joint it hangs from. On the dish's
  // side of the walkway the ground follows the tipped rim's plane near the rim, so the raised far half is set into a
  // hillside and no underside of the bowl shows
  const TILT_DEG = 30, TILT_D = new THREE.Vector3(-1, 0, 0);
  const TILT_P = new THREE.Vector3(DISH.x - DISH.r, RIM_Y, DISH.z);
  const TILT = new THREE.Matrix4().makeTranslation(TILT_P.x, TILT_P.y, TILT_P.z)
    .multiply(new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(TILT_D.z, 0, -TILT_D.x), TILT_DEG * DEG)) // up x TILT_D
    .multiply(new THREE.Matrix4().makeTranslation(-TILT_P.x, -TILT_P.y, -TILT_P.z));
  const tiltDrop = (x, z) => Math.tan(TILT_DEG * DEG) * (TILT_D.x * (x - TILT_P.x) + TILT_D.z * (z - TILT_P.z)); // tipped rim plane
  const TILT_INV = TILT.clone().invert(), tv = new THREE.Vector3();
  const DISH_O = new THREE.Vector3(DISH.x, DISH_CY, DISH.z).applyMatrix4(TILT); // centre of the bowl's sphere, tipped
  function groundY(x, z) {
    const n1 = simplex.noise(x / 22, z / 22), n2 = simplex.noise(x / 7 + 30, z / 7);
    // the low ground the walkway crosses: a valley under it, rising on the left, a level apron round the dish
    let h = -8 + Math.max(0, -x - 4) * 0.32 + Math.max(0, Math.abs(x) - 90) * 0.4 + n1 * 2.2 + n2 * 0.5;
    const drop = tiltDrop(x, z), q = tv.set(x, RIM_Y - drop, z).applyMatrix4(TILT_INV); // the same spot on the untipped dish
    const r = Math.hypot(q.x - DISH.x, q.z - DISH.z);
    h += (RIM_Y - drop - 0.25 - h) * (1 - smooth(r, DISH.r + 3, DISH.r + 43)) * smooth(x, -6, 2);
    const ox = x - DISH_O.x, oz = z - DISH_O.z, rr = DISH.R ** 2 - ox * ox - oz * oz;
    if (rr > 0) { // under the tipped bowl: its surface straight above this spot, where that point is on the bowl
      const yb = DISH_O.y - Math.sqrt(rr), b = tv.set(x, yb, z).applyMatrix4(TILT_INV);
      if (Math.hypot(b.x - DISH.x, b.z - DISH.z) < DISH.r + 0.6) h = Math.min(h, yb - 1.5);
    }
    if (Math.abs(x) < 5.1 && z < WALK_A + 1 && z > WALK_B - 1) h = Math.min(h, deckY(z) - 0.3); // never through the deck
    // open, nearly level ground in front of each portal, at track height
    const open = Math.max(smooth(z, WALK_A - 6, WALK_A + 2), smooth(-z, -WALK_B - 6, -WALK_B + 2)) * (1 - smooth(Math.abs(x), 22, 40));
    h += (-0.15 + n2 * 0.08 - h) * open;
    // a small wooded mound the tunnel runs into, starting right at each portal face
    const mound = Math.max(smooth(z, 0, 5), smooth(-z, WALK_L, WALK_L + 5)) * (1 - smooth(Math.abs(x), 8, 24));
    return h + Math.max(0, 7.5 + n1 * 1.5 - h) * mound;
  }
  // no ground just behind the portal faces, where the mound's first slope would cut into the tunnel mouth (terrain
  // rows fall exactly on both faces). Under the bridge the valley floor stays: without it, looking down past the deck's
  // edge showed a black band of empty background between the railing and the deck
  const inCorridor = (x, z) => Math.abs(x) < 4.6 && ((z > 0 && z < 5) || (z < -WALK_L && z > -WALK_L - 5));
  const outside = new THREE.Group(), Y_AXIS = new THREE.Vector3(0, 1, 0);
  outScene.add(outside);
  outScene.fog = new THREE.FogExp2(0x0d1426, 0.0045);
  const canvasTex = (w, h, draw, repeat) => {
    const c = document.createElement('canvas'); c.width = w; c.height = h;

    for (let i = 0; i < p.length; i += 3) {
      // dark enough that the sky becomes sparse dots, paler toward the horizon; black below it, which is what
      // shows down past the bridge where there is no ground
      const t = Math.max(0, p[i + 1] / 1000), k = p[i + 1] < 0 ? 0 : (1 - t) ** 3;
      c.set([0.003 + 0.016 * k, 0.004 + 0.021 * k, 0.009 + 0.04 * k], i);
    }
    dome.setAttribute('color', new THREE.BufferAttribute(c, 3));
    sky.add(new THREE.Mesh(dome, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false })));
    const moon = new THREE.Mesh(new THREE.CircleGeometry(20, 32), new THREE.MeshBasicMaterial({ color: new THREE.Color(1.6, 1.55, 1.4), fog: false }));
    moon.position.copy(MOON).multiplyScalar(900);
    moon.lookAt(0, 0, 0);
    const stars = new Float32Array(600 * 3), v = new THREE.Vector3();
    for (let i = 0; i < 600; i++) {
      v.set(hash(i * 3.1) * 2 - 1, hash(i * 5.7 + 1) * 0.9 + 0.08, hash(i * 9.3 + 2) * 2 - 1);
      v.normalize().multiplyScalar(950).toArray(stars, i * 3);
    }
    const sg = new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(stars, 3));
    const ring = [], N = 220;
    for (let i = 0; i <= N; i++) {
      const a = (i / N) * TAU, rr = 520 + 90 * simplex.noise(i * 0.07, 3);
      const h = 35 + 70 * Math.abs(simplex.noise(i * 0.045, 7)) + 25 * Math.abs(simplex.noise(i * 0.2, 9));
      ring.push(Math.cos(a) * rr, -60, Math.sin(a) * rr, Math.cos(a) * rr, h, Math.sin(a) * rr);
    }
    const mg = new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(ring, 3));
    const idx = [];
    for (let i = 0; i < N; i++) idx.push(2 * i, 2 * i + 1, 2 * i + 2, 2 * i + 1, 2 * i + 3, 2 * i + 2);
    mg.setIndex(idx);
    sky.add(moon, new THREE.Points(sg, new THREE.PointsMaterial({ size: 1.6, sizeAttenuation: false, color: 0x8f9bbd, fog: false })),
      new THREE.Mesh(mg, new THREE.MeshBasicMaterial({ color: 0x05070c, side: THREE.DoubleSide, fog: false })));
  }
  const moonLight = new THREE.DirectionalLight(0xaebbd8, 0.9);
  moonLight.position.copy(MOON).multiplyScalar(50);
  sky.add(moonLight, moonLight.target);
  const beam2 = beam.clone(), spill2 = spill.clone(); // the torch lights the outdoors too
  outScene.add(new THREE.HemisphereLight(0x33405e, 0x0b0907, 0.35), beam2, beam2.target, spill2, spill2.target);
  renderer.compile(outScene, camera); // no shader compile stall the first time a walkway comes into view

  // ---------- hand holding the torch: the left hand cut out of a photo of the grip, seen from behind the way the eye
  // sees it (left forearm in from the lower left, the fist round the upright torch, the thumb over its front end, the
  // fingers' nails on the right). The photo's tones are flattened to five levels, darkened and cooled for the tunnel,
  // and outlined. tools/trace_hand.py makes the PNG, transparent everywhere outside the hand. It sits on a plane in
  // front of the camera, in its own scene, so the tunnel never hides it. Coordinates are the photo's pixels
  // (IMG_thumb_over, 3024 x 4032); the forearm runs on past its lower-left corner. The beam starts at the torch's front
  // end, under the thumb.
  const HAND = { X0: -3300, Y0: 1750, X1: 1950, Y1: 6000, FIST: [1560, 2500], FIST_W: 560, HEAD: [1652, 1830] };
  const handTex = await new THREE.TextureLoader().loadAsync('assets/hand/hand.png').catch(() => null); // none from file://
  if (handTex) handTex.colorSpace = THREE.SRGBColorSpace;
  const hand = new THREE.Group(), headLocal = new THREE.Vector3();
  const handPlane = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ map: handTex, transparent: true, depthTest: false, depthWrite: false, visible: !!handTex }));
  hand.add(handPlane);
  handScene.add(hand);


  // ---------- layout (resize, rotation, iframe resize) ----------
  const L = { W: 1, H: 1, cols: 1, rows: 1, cell: 8, offX: 0, offY: 0, w: 1, h: 1 };
  const bufferSize = new THREE.Vector2();
  function layout() {
    const w = Math.max(1, canvas.clientWidth), h = Math.max(1, canvas.clientHeight);
    const dpr = Math.min(window.devicePixelRatio || 1, 2); // 3x phones: the full-screen character pass is the cost
    const forced = Number(params.get('cell'));
    const cssCell = forced >= 1 && forced <= 32 ? forced : (w < 600 ? 1.5 : 2);
    renderer.setPixelRatio(dpr);
    renderer.setSize(w, h, false);
    renderer.getDrawingBufferSize(bufferSize);
    const cell = Math.max(3, Math.round(cssCell * dpr));
    const K = K_FORCED || (cell <= 4 ? 1 : 3);
    const cols = Math.ceil(bufferSize.x / cell), rows = Math.ceil(bufferSize.y / cell);
    Object.assign(L, { w, h, W: bufferSize.x, H: bufferSize.y, cols, rows, cell,
      offX: Math.floor((cols * cell - bufferSize.x) / 2), offY: Math.floor((rows * cell - bufferSize.y) / 2) });
    composer.setSize(cols * K, rows * K);
    U.uGrid.value.set(cols, rows);
    U.uOffset.value.set(L.offX, L.offY);
    U.uTexel.value.set(0.25 / cols, 0.25 / rows); // taps a quarter cell from the centre: a box average for any K
    if (U.uCell.value !== cell || !U.tGlyph.value) { U.tGlyph.value?.dispose(); U.tGlyph.value = glyphs(cell); }
    U.uCell.value = cell;
    if (pmndrs) { pmndrs.composer.setSize(w, h, false); pmndrs.fx.cellSize = cell; }
    // same tunnel framing in both orientations: aim for ~44 deg across, within 50-78 deg vertically
    const aspect = cols / rows;
    camera.aspect = handCamera.aspect = aspect;
    camera.fov = THREE.MathUtils.clamp(2 * Math.atan(Math.tan(22 * DEG) / aspect) / DEG, 50, 78);
    handCamera.fov = camera.fov * 0.8; // a narrower view-model lens, as FPS games do, so the near forearm isn't blown up
    camera.updateProjectionMatrix();
    handCamera.updateProjectionMatrix();
    placeHand();
  }

  function placeHand() { // the fist low and a little left of centre, inside the safe area; the forearm runs off the corner
    const cs = getComputedStyle(safeProbe);
    const insetL = parseFloat(cs.paddingLeft) || 0, insetB = parseFloat(cs.paddingBottom) || 0;
    const { w, h } = L, portrait = w < h;
    // fist about a tenth of the screen height, the size of the earlier 3D hand; the photo only sets its shape
    const s = (portrait ? Math.min(0.18 * w, 0.095 * h) : Math.min(0.1 * h, 0.07 * w)) / HAND.FIST_W; // CSS px per photo px
    // the fist sits a third of the visible forearm back from where it was (arm less outstretched), along the forearm
    const fx = insetL + w * (portrait ? 0.34 : 0.37), fy = h * (portrait ? 0.81 : 0.81) - insetB;
    const left = fx - (HAND.FIST[0] - HAND.X0) * s, top = fy - (HAND.FIST[1] - HAND.Y0) * s;
    const tanV = Math.tan(handCamera.fov * DEG / 2), tanH = tanV * handCamera.aspect;
    const X = (px) => ((px / w) * 2 - 1) * tanH, Ypx = (py) => (1 - (py / h) * 2) * tanV; // screen -> plane at 1 m
    const x0 = X(left), x1 = X(left + (HAND.X1 - HAND.X0) * s), y0 = Ypx(top), y1 = Ypx(top + (HAND.Y1 - HAND.Y0) * s);
    handPlane.scale.set(x1 - x0, y0 - y1, 1);
    handPlane.position.set((x0 + x1) / 2, (y0 + y1) / 2, -1);
    // the beam starts at the torch head in the drawing, half a metre in front of the eye
    const hx = X(left + (HAND.HEAD[0] - HAND.X0) * s), hy = Ypx(top + (HAND.HEAD[1] - HAND.Y0) * s);
    headLocal.set(hx * 0.5, hy * 0.5, -0.5);
  }

  // At 3-4 device px a font glyph is a grey smudge, so small cells get hand-drawn 3x3 pixel forms of the same ten
  // characters: each step adds ink and keeps a recognisable shape ( . : - + = x # % @ ).
  const TINY = ['.........', '....#....', '.#.....#.', '...###...', '.#.###.#.', '###...###',
    '#.#.#.#.#', '#.#####.#', '####.####', '#########'];
  function glyphs(cell) {
    const c = document.createElement('canvas');
    c.width = cell * CHARS.length; c.height = cell;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = `bold ${Math.round(cell * 1.15)}px Menlo, Consolas, "DejaVu Sans Mono", "Roboto Mono", "Courier New", monospace`;
    const px = (i, n) => Math.round((n * cell) / 3);
    // a 6-10 px glyph is only a few grey pixels, so order the slots by how much each one really covers
    const order = [...CHARS].map((ch, i) => {
      if (cell <= 4) {
        [...TINY[i]].forEach((on, k) => {
          if (on === '#') g.fillRect(i * cell + px(i, k % 3), px(i, (k / 3) | 0), px(i, (k % 3) + 1) - px(i, k % 3), px(i, ((k / 3) | 0) + 1) - px(i, (k / 3) | 0));
        });
      } else g.fillText(ch, (i + 0.5) * cell, cell * 0.54);
      const d = g.getImageData(i * cell, 0, cell, cell).data;
      let ink = 0;
      for (let k = 3; k < d.length; k += 4) ink += d[k];
      return { i, ink };
    }).sort((a, b) => a.ink - b.ink);
    const out = document.createElement('canvas');
    out.width = c.width; out.height = cell;
    order.forEach(({ i }, j) => out.getContext('2d').drawImage(c, i * cell, 0, cell, cell, j * cell, 0, cell, cell));
    const t = new THREE.CanvasTexture(out);
    t.minFilter = t.magFilter = THREE.NearestFilter;
    t.generateMipmaps = false;
    return t;
  }

  new ResizeObserver(() => layout()).observe(canvas);
  layout();

  // ---------- looking: tap turns the view (and the torch with it) toward that point, drag keeps turning ----------
  // Like a first-person game: the camera turns, the hand stays where it is on screen and the beam lands mid-screen.
  // The walk itself always follows the tunnel. Left and right go all the way round; up and down are limited. After a
  // few idle seconds the view drifts back to rest, the short way round.
  const PITCH_MIN = -35 * DEG, PITCH_MAX = 45 * DEG, PITCH_REST = -8 * DEG;
  const look = { yaw: 0, pitch: PITCH_REST, yawGoal: 0, pitchGoal: PITCH_REST, idle: 99, rest: 0, restPitch: PITCH_REST };
  const dir = new THREE.Vector3(), target = new THREE.Vector3(), head = new THREE.Vector3();
  const wrapAngle = (a) => a - Math.round(a / TAU) * TAU; // to -180..180 deg, for the short way round
  let pressing = false, touched = false, lastX = 0, lastY = 0, msgTimer = 0;
  const clampLook = () => { look.pitchGoal = THREE.MathUtils.clamp(look.pitchGoal, PITCH_MIN, PITCH_MAX); };
  function showMsg(text) { // one line in the hint's place, fading out after a while
    msg.textContent = text; msg.hidden = false; msg.classList.remove('off');
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => { msg.classList.add('off'); msgTimer = setTimeout(() => { msg.hidden = true; }, 1300); }, 3000);
  }

  // phones and tablets: turning the device turns the view (DeviceOrientation). The first touch asks for the sensor
  // (iOS only lets a page ask from inside a tap); the device's direction at its first reading stands for the view as
  // it is then. While it runs the view does not drift back to rest, and taps and drags add to it. The corner button
  // turns it off, and on again from wherever the device points then.
  const gyro = { on: false, asked: false, base: null, prev: 0, yaw: 0, pitch: 0, addYaw: 0, addPitch: 0 };
  const gyroBtn = document.getElementById('gyro');
  const qDev = new THREE.Quaternion(), qScreen = new THREE.Quaternion(), eDev = new THREE.Euler(), fwd = new THREE.Vector3();
  const Q_BACK = new THREE.Quaternion(-Math.SQRT1_2, 0, 0, Math.SQRT1_2), Z_AXIS = new THREE.Vector3(0, 0, 1);
  function onOrient(e) {
    if (!gyro.on || e.alpha == null || e.beta == null) return;
    const screenAngle = (screen.orientation ? screen.orientation.angle : window.orientation || 0) * DEG; // portrait or landscape
    eDev.set(e.beta * DEG, e.alpha * DEG, -(e.gamma || 0) * DEG, 'YXZ'); // the device in the world
    qDev.setFromEuler(eDev).multiply(Q_BACK).multiply(qScreen.setFromAxisAngle(Z_AXIS, -screenAngle)); // a camera behind the screen
    fwd.set(0, 0, -1).applyQuaternion(qDev);
    const yaw = Math.atan2(-fwd.x, -fwd.z), pitch = Math.asin(THREE.MathUtils.clamp(fwd.y, -1, 1));
    if (!gyro.base) {
      gyro.base = pitch - look.pitch; gyro.prev = yaw; gyro.yaw = look.yaw; gyro.addYaw = gyro.addPitch = 0;
      gyroBtn.hidden = false; gyroBtn.setAttribute('aria-pressed', 'true');
      showMsg('轉動手機看四周');
    }
    gyro.yaw += wrapAngle(yaw - gyro.prev); gyro.prev = yaw; // unwrapped, so turning round keeps going
    gyro.pitch = pitch - gyro.base;
  }
  function askGyro() {
    if (gyro.asked || !window.DeviceOrientationEvent || !(matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0)) return;
    gyro.asked = true;
    const start = () => { gyro.on = true; gyro.base = null; addEventListener('deviceorientation', onOrient); };
    if (typeof DeviceOrientationEvent.requestPermission === 'function') { // iOS 13+: a system prompt, answered once per site
      DeviceOrientationEvent.requestPermission().then((s) => { if (s === 'granted') start(); }).catch(() => {});
    } else start();
  }
  gyroBtn.addEventListener('click', () => {
    gyro.on = !gyro.on; gyro.base = null; // on again: recentred on the device's direction at its next reading
    gyroBtn.setAttribute('aria-pressed', String(gyro.on));
    showMsg(gyro.on ? '轉動手機看四周' : '陀螺儀關閉，點畫面照亮');
  });
  const gyroLive = () => gyro.on && gyro.base !== null;
  function turnBy(dYaw, dPitch) { // a drag or tap: added on top of the device's direction when that drives the view
    if (gyroLive()) { gyro.addYaw += dYaw; gyro.addPitch += dPitch; return; }
    look.yawGoal += dYaw; look.pitchGoal += dPitch; clampLook();
  }

  function lookAtPointer(e) { // aim the view at the point under the pointer, as the camera stands now
    const r = canvas.getBoundingClientRect();
    const fx = (e.clientX - r.left) / r.width, fy = 1 - (e.clientY - r.top) / r.height;
    const tanV = Math.tan(camera.fov * DEG / 2);
    const sx = ((fx * L.W + L.offX) / (L.cols * L.cell)) * 2 - 1, sy = ((fy * L.H + L.offY) / (L.rows * L.cell)) * 2 - 1;
    dir.set(sx * tanV * camera.aspect, sy * tanV, -1).normalize().applyQuaternion(camera.quaternion);
    turnBy(wrapAngle(Math.atan2(-dir.x, -dir.z) - look.yaw) + look.yaw - look.yawGoal, Math.asin(dir.y) - look.pitchGoal);
  }
  canvas.addEventListener('pointerdown', (e) => {
    pressing = touched = true;
    canvas.setPointerCapture(e.pointerId);
    lastX = e.clientX; lastY = e.clientY; look.idle = 0;
    askGyro();
    lookAtPointer(e);
    if (!msg.hidden) { msg.classList.add('off'); setTimeout(() => { msg.hidden = true; }, 1300); }
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!pressing) return;
    const perPx = (2 * Math.atan(Math.tan(camera.fov * DEG / 2))) / canvas.clientHeight; // radians per CSS pixel
    turnBy(-(e.clientX - lastX) * perPx, (lastY - e.clientY) * perPx); // drag right, turn right
    lastX = e.clientX; lastY = e.clientY; look.idle = 0;
  });
  const release = () => { pressing = false; };
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('dblclick', (e) => e.preventDefault());

  function hitTunnel(o, d) { // distance from o along unit d to the idealised tunnel surface
    let t = 60;
    if (d.y < -1e-4) t = Math.min(t, -o.y / d.y);
    if (Math.abs(d.x) > 1e-4) {
      const ts = ((d.x > 0 ? R : -R) - o.x) / d.x;
      if (ts > 0 && o.y + d.y * ts <= HW) t = Math.min(t, ts);
    }
    const oy = o.y - HW, a = d.x * d.x + d.y * d.y;
    if (a > 1e-8) {
      const b = o.x * d.x + oy * d.y, c = o.x * o.x + oy * oy - R * R, disc = b * b - a * c;
      if (disc >= 0) { const ta = (-b + Math.sqrt(disc)) / a; if (ta > 0 && o.y + d.y * ta >= HW) t = Math.min(t, ta); }
    }
    return t;
  }

  // ---------- loop (paused when hidden or scrolled out of an embedding page) ----------
  let walked = START, lift = 0, fade = 0, last = 0, raf = 0, running = false, visible = !document.hidden, onScreen = true;
  function frame(now) {
    raf = requestAnimationFrame(frame);
    const dt = Math.min(0.1, (now - last) / 1000 || 0);
    last = now;
    const speed = PAUSE ? 0 : reducedMotion.matches ? SPEED * 0.35 : SPEED;
    walked += speed * dt;
    camera.position.z = -walked;
    const phase = walked / 0.75 * Math.PI * 2;
    const bob = BOB && !reducedMotion.matches ? 1 : 0; // a slow walk's sway, small enough not to make anyone queasy
    camera.position.x = Math.sin(phase / 2) * 0.006 * bob;
    hand.position.y = Math.sin(phase - 0.6) * 0.005 * bob; // the hand rides along, a beat behind
    // segments are kept behind the eye too, so turning round never finds the walls gone (the far end stays dark)
    for (const seg of segments) if (seg.z0 > camera.position.z + 1 + BEHIND * SEG_L) { seg.z0 -= SEGS * SEG_L; buildSegment(seg); }
    // outdoors only while a walkway slot is among the built ones; the lid closes the tunnel where the walls stop
    let zone = -1, far = segments[0];
    for (const seg of segments) { if (seg.walk) zone = Math.floor(slot(seg) / CYCLE); if (seg.z0 < far.z0) far = seg; }
    outPass.enabled = zone >= 0 && !pmndrs;
    if (zone >= 0) outside.position.z = zoneExit(zone);
    // climb the walkway's steps: the eye follows the deck with a short lag, like stepping up
    const zl = zone >= 0 ? camera.position.z - zoneExit(zone) : 1;
    lift += (deckY(zl) - lift) * (1 - Math.exp(-dt / 0.12));
    // at rest the view turns toward the feed tower while on the walkway (so a phone held upright sees it too)
    const byDish = zl < WALK_A + 4 && zl > DISH.z - 4;
    look.rest = byDish ? THREE.MathUtils.clamp(Math.atan2(-DISH.x, zl - DISH.z), -60 * DEG, 0) : 0;
    look.restPitch = byDish ? 2 * DEG : PITCH_REST; // the tipped bowl below, the tower rising over it, as in the photos
    camera.position.y = EYE + lift + Math.sin(phase) * 0.014 * bob;
    cap.visible = !far.walk;
    cap.position.z = far.z0;
    if (carpets) { // the rugs stand in the carpet stretch of the nearest cycle
      const n = Math.floor((4 - camera.position.z) / SEG_L), k = Math.round((n - CARPET_SLOT - 1) / CYCLE);
      carpets.position.z = 4 - (CYCLE * k + CARPET_SLOT) * SEG_L;
    }
    sky.position.copy(camera.position);

    look.idle += dt;
    if (gyroLive()) { // the device's direction, plus what taps and drags added; no drifting back
      look.yawGoal = gyro.yaw + gyro.addYaw;
      look.pitchGoal = THREE.MathUtils.clamp(gyro.pitch + gyro.addPitch, PITCH_MIN, PITCH_MAX);
    } else if (look.idle > 3.5 && !pressing) { // drift back to rest: ahead in the tunnel, toward the mirror outside
      const k = 1 - Math.exp(-dt / 1.2);
      look.yawGoal += wrapAngle(look.rest - look.yawGoal) * k; // the short way round
      look.pitchGoal += (look.restPitch - look.pitchGoal) * k;
    }
    const prevYaw = look.yaw, s = 1 - Math.exp(-dt / 0.09); // about 0.3 s to settle
    look.yaw += (look.yawGoal - look.yaw) * s;
    look.pitch += (look.pitchGoal - look.pitch) * s;
    camera.rotation.set(look.pitch, look.yaw, 0, 'YXZ');
    camera.updateMatrixWorld();
    // the hand lags a touch behind fast turns, like a held weapon
    hand.rotation.y = THREE.MathUtils.clamp((look.yaw - prevYaw) / Math.max(dt, 1e-3) * -0.05, -0.12, 0.12);
    dir.set(0, 0, -1).applyQuaternion(camera.quaternion); // the beam lands where the view is centred
    target.copy(camera.position).addScaledVector(dir, hitTunnel(camera.position, dir));
    hand.updateMatrixWorld();
    head.copy(headLocal).applyMatrix4(hand.matrixWorld).applyQuaternion(camera.quaternion).add(camera.position); // torch head
    beam.position.copy(head); spill.position.copy(head); bounce.position.copy(camera.position);
    beam.target.position.copy(target); spill.target.position.copy(target);
    beam2.position.copy(head); spill2.position.copy(head); beam2.target.position.copy(target); spill2.target.position.copy(target);

    fade = Math.min(1, fade + dt / 1.4);
    U.uFade.value = fade * fade;
    (pmndrs ? pmndrs.composer : composer).render(dt);
  }
  function update() {
    const go = visible && onScreen;
    if (go && !running) { running = true; last = performance.now(); raf = requestAnimationFrame(frame); }
    else if (!go && running) { running = false; cancelAnimationFrame(raf); }
  }
  document.addEventListener('visibilitychange', () => { visible = !document.hidden; update(); });
  new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; update(); }).observe(canvas);
  update();
  setTimeout(() => { if (!touched) msg.hidden = false; }, 1600);
}
</script>
</body>
</html>
